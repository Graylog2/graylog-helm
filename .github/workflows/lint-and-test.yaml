name: Tests

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  helm-ct-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.16.4
          - v4.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run ct lint
        run: ct lint --config .github/ct.yaml --all

      # `ct lint` never looks at examples/, so a shipped example could reference a
      # removed key, miss a required one, or trip a template-time guard and no one
      # would find out until a user copied it. `helm template` also enforces
      # values.schema.json, so this covers schema drift in the examples too.
      #
      # Raw manifests in examples/ (Secrets, Pods) are not values overlays and are
      # skipped by looking for a top-level `apiVersion:`.
      - name: Render shipped examples
        run: |
          set -u
          rc=0
          while IFS= read -r f; do
            if grep -q '^apiVersion:' "$f"; then
              echo "skip     $f (raw manifest, not a values overlay)"
              continue
            fi
            if out=$(helm template ci-examples charts/graylog -f "$f" 2>&1); then
              echo "ok       $f"
            else
              echo "FAILED   $f"
              printf '%s\n' "$out" | sed 's/^/           /'
              rc=1
            fi
          done < <(find examples -name '*.yaml' | sort)
          exit $rc

  helm-unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        helm-version:
          - v3.16.4
          - v4.2.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Install helm-unittest plugin
        # `helm plugin install --version` does NOT pin to a git tag — it
        # clones the default branch. Clone the v1.0.3 tag explicitly and
        # install from local path. v1.0.3 is the latest helm-unittest
        # release whose plugin.yaml does NOT use the `platformHooks` field;
        # v1.1.0+ adds that field, which Helm 3.16.4 rejects during
        # plugin.yaml parsing. Pinning to v1.0.3 keeps both matrix variants
        # (Helm 3 and Helm 4) compatible.
        # Local-path install also sidesteps Helm 4's signature verification.
        run: |
          git clone --depth 1 --branch v1.0.3 https://github.com/helm-unittest/helm-unittest /tmp/helm-unittest
          helm plugin install /tmp/helm-unittest

      - name: Run helm unittest
        run: helm unittest charts/graylog

      # helm-unittest can only assert on rendered text. These two run the shipped
      # shell scripts for real: the preStop drain against a stubbed metrics
      # endpoint, and the init script against fixture volumes (including the
      # upgrade path, where an existing volume must not be clobbered).
      - name: preStop drain behaviour tests
        run: sh charts/graylog/tests/scripts/prestop-drain-behavior-test.sh

      - name: init-script behaviour tests
        # always() so a drain failure above does not hide an init failure here.
        if: always()
        run: sh charts/graylog/tests/scripts/init-graylog-behavior-test.sh

  helm-ct-install:
    runs-on: ubuntu-latest
    needs: [helm-ct-lint, helm-unittest]
    # Backstop only. A healthy leg spends ~2 minutes on setup and a few more
    # bringing the stack up; the default job ceiling is 360 minutes, so without
    # this a wedged install burns hours per leg before anyone notices. Namespace
    # termination can genuinely hang on finalizers, and that is not covered by
    # `helm-extra-args: --timeout=900s`, which bounds only the install itself.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Asymmetric K8s × Helm matrix: full K8s coverage on Helm 3 (the chart's
      # stated minimum per docs/TESTING.md), with Helm 4 added as bonus coverage
      # on the most recent K8s version. Expand by adding more `include:` entries.
      matrix:
        include:
          - helm-version: v3.16.4
            k8s-version: v1.32.11
          - helm-version: v3.16.4
            k8s-version: v1.33.7
          - helm-version: v3.16.4
            k8s-version: v1.34.3
          - helm-version: v4.2.0
            k8s-version: v1.34.3
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.helm-version }}

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          node_image: kindest/node:${{ matrix.k8s-version }}

      - name: Install MongoDB Kubernetes Operator
        # The operator's own chart requests 500m CPU by default — an eighth of
        # the runner for a controller reconciling a single one-member replica
        # set. Shrinking it leaves that CPU for the workloads under test.
        run: |
          helm upgrade --install mongodb-kubernetes-operator mongodb-kubernetes \
            --repo https://mongodb.github.io/helm-charts \
            --version "1.6.1" \
            --set operator.watchNamespace="*" \
            --set operator.resources.requests.cpu=100m \
            --set operator.resources.requests.memory=200Mi \
            --set operator.resources.limits.cpu=500m \
            --set operator.resources.limits.memory=500Mi \
            --namespace operators \
            --create-namespace \
            --wait \
            --timeout 5m

      # The CPU budget on this node decides whether the stack can be scheduled at
      # all. Printing it once makes "Insufficient cpu" a one-line diagnosis
      # instead of an inference from pod descriptions.
      - name: Show node capacity and reservations
        run: |
          kubectl get nodes -o custom-columns=\
          'NAME:.metadata.name,CPU:.status.allocatable.cpu,MEM:.status.allocatable.memory'
          kubectl describe node | sed -n '/Allocated resources/,/Events/p'

      - name: Generate ephemeral CI rootPassword and mask in workflow logs
        id: ci-root-password
        run: |
          password=$(openssl rand -hex 16)
          echo "::add-mask::${password}"
          echo "value=${password}" >> "$GITHUB_OUTPUT"

      # All sizing lives in charts/graylog/ci/ci-values.yaml, which ct discovers
      # automatically. It used to be duplicated here as --set flags, which take
      # precedence over the values file — so ci-values.yaml's graylog memory
      # request was silently overridden and the two disagreed. Only the generated
      # password is passed here, because it cannot be committed.
      #
      # `helm --wait` prints nothing until it succeeds or times out, so this step
      # used to sit silent for the full 15 minutes and a stuck install looked
      # exactly like a slow one. The watcher below streams anything not yet
      # Running plus recent warning events, so a pod that cannot be scheduled is
      # visible within seconds instead of in a post-mortem dump.
      - name: Run ct install
        run: |
          watch_cluster() {
            while true; do
              echo "::group::cluster state $(date -u +%H:%M:%S)"
              kubectl get pods -A \
                --field-selector=status.phase!=Running,status.phase!=Succeeded \
                -o wide 2>/dev/null || true
              kubectl get events -A --field-selector type=Warning \
                --sort-by=.lastTimestamp 2>/dev/null | tail -8 || true
              echo "::endgroup::"
              sleep 20
            done
          }
          watch_cluster &
          watcher=$!
          trap 'kill "$watcher" 2>/dev/null || true' EXIT

          ct install --config .github/ct.yaml --all \
            --helm-extra-set-args "\
            --set graylog.config.rootPassword=${{ steps.ci-root-password.outputs.value }}"
