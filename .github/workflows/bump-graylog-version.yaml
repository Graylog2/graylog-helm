name: Bump Graylog version

# Opens a pull request when a newer Graylog patch release is on Docker Hub.
# Chart.yaml appVersion is the only place the default version lives, so that is
# the only line the pull request changes.
#
# The pull request uses the deps type, which release-please-config.json lists as
# a visible changelog section, so each merged bump releases a chart patch.
#
# Only patch releases within the current major.minor line are picked up. A new
# minor or major (7.2.0, 8.0.0) can change config and upgrade behaviour, so
# someone bumps those by hand, or runs this workflow with the `line` input.
#
# The chart deploys three images: graylog/graylog, graylog/graylog-enterprise
# and graylog/graylog-datanode. They are not always published together, so a
# version is only proposed once all three exist.
#
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows, so
# lint-and-test would never run on the bump. Set the BUMP_PR_TOKEN secret to a
# fine-grained PAT (contents and pull requests, read/write) or a GitHub App
# token. Without it the pull request still opens, but CI has to be started by
# hand, for example by closing and reopening it.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      line:
        description: Version line to track, as major.minor (defaults to the current appVersion line)
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-graylog-version
  cancel-in-progress: false

jobs:
  bump:
    # Forks would open pull requests against themselves every night.
    if: github.repository == 'Graylog2/graylog-helm'
    runs-on: ubuntu-latest
    env:
      CHART_FILE: charts/graylog/Chart.yaml
      GH_TOKEN: ${{ secrets.BUMP_PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.BUMP_PR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Find the newest published version
        id: latest
        env:
          LINE_INPUT: ${{ inputs.line }}
        run: |
          current="$(yq e '.appVersion' "$CHART_FILE")"
          line="${LINE_INPUT:-${current%.*}}"

          # Plain X.Y.Z tags only. This drops -rc, -beta, -SNAPSHOT and the
          # -jre17 style variants.
          stable_tags() {
            local url="https://hub.docker.com/v2/repositories/graylog/$1/tags?page_size=100&name=${line}."
            while [[ -n "$url" && "$url" != "null" ]]; do
              local page
              page="$(curl -fsS --retry 3 "$url")"
              jq -r '.results[].name' <<<"$page"
              url="$(jq -r '.next' <<<"$page")"
            done | grep -E "^${line//./\\.}\.[0-9]+$" | sort -u
          }

          # Intersection of the three images.
          common="$(comm -12 \
            <(comm -12 <(stable_tags graylog) <(stable_tags graylog-enterprise)) \
            <(stable_tags graylog-datanode))"
          latest="$(printf '%s\n' "$common" | sed '/^$/d' | sort -V | tail -n1)"

          echo "current=$current latest=${latest:-none} line=$line"
          if [[ -z "$latest" ]]; then
            echo "::error::no release found for ${line}.x on all three images"
            exit 1
          fi

          # Only ever move forward. sort -V picks the higher of the two.
          newest="$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n1)"
          if [[ "$latest" == "$current" || "$newest" != "$latest" ]]; then
            echo "appVersion $current is current"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=true" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.latest.outputs.bump == 'true'
        env:
          CURRENT: ${{ steps.latest.outputs.current }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: |
          branch="bot/graylog-${LATEST}"
          title="deps(graylog): Bump default Graylog version to ${LATEST}"

          # A closed pull request on the same branch means someone declined this
          # version. Do not reopen it every night.
          existing="$(gh pr list --head "$branch" --state all --json number --jq 'length')"
          if [[ "$existing" != "0" ]]; then
            echo "A pull request for ${LATEST} already exists, nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"

          yq e -i ".appVersion = \"${LATEST}\"" "$CHART_FILE"
          # yq can reflow comments and spacing. Fail rather than ship more than
          # the one line.
          if [[ "$(git diff --numstat -- "$CHART_FILE" | cut -f1,2)" != $'1\t1' ]]; then
            echo "::error::expected a one line change in $CHART_FILE"
            git diff -- "$CHART_FILE"
            exit 1
          fi

          git commit -am "$title"
          git push origin "$branch"

          body="$(cat <<EOF
          Graylog ${LATEST} is on Docker Hub for \`graylog/graylog\`,
          \`graylog/graylog-enterprise\` and \`graylog/graylog-datanode\`.

          This changes \`appVersion\` in \`charts/graylog/Chart.yaml\` from ${CURRENT} to ${LATEST}.
          The chart's default image tag follows it.

          Before merging, check the [${LATEST} release notes](https://go2docs.graylog.org/current/downloading_and_installing_graylog/upgrading_graylog.htm)
          for anything that needs a chart change.
          EOF
          )"
          # Strip the heredoc indentation.
          body="$(sed 's/^          //' <<<"$body")"

          gh pr create --base main --head "$branch" \
            --title "$title" --body "$body"
