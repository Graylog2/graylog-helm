name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Per-package outputs are keyed by package path.
      graylog-released: ${{ steps.release.outputs['charts/graylog--release_created'] }}
      graylog-tag: ${{ steps.release.outputs['charts/graylog--tag_name'] }}
      graylog-version: ${{ steps.release.outputs['charts/graylog--version'] }}
      paths-released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # No artifacthub.io/changes step here on purpose. The annotation is
      # generated from CHANGELOG.md when the chart is packaged, not committed
      # onto the release PR: a commit here would race release-please's own
      # force-push of the branch, and it would make hand edits to the annotation
      # depend on being the last change before the merge. See
      # .github/scripts/artifacthub_changes.py.

  # Linked to the release rather than to a path filter or a tag push: refs
  # created with GITHUB_TOKEN raise no events, so only the release-please run
  # itself knows a release happened.
  publish-chart:
    needs: release-please
    if: needs.release-please.outputs.graylog-released == 'true'
    uses: ./.github/workflows/release-graylog.yaml
    permissions:
      contents: write
    with:
      tag: ${{ needs.release-please.outputs.graylog-tag }}
