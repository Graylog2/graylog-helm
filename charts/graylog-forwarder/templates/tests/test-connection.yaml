apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "graylog-forwarder.fullname" . }}-test-connection"
  labels:
    {{- include "graylog-forwarder.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: nc
      image: busybox
      command:
        - sh
        - -c
        - |
          nc -z {{ include "graylog-forwarder.fullname" . }} {{ .Values.service.ports.forwarderConfig }}
  restartPolicy: Never
