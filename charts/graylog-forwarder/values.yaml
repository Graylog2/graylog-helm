replicaCount: 1

image:
  repository: graylog/graylog-forwarder
  tag: "7.0"
  pullPolicy: IfNotPresent
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

config:
  serverHostname: ""
  # API token used to authenticate with the Graylog server.
  # Set apiToken directly, or point existingSecret at a Secret that has a
  # GRAYLOG_FORWARDER_GRPC_API_TOKEN key — existingSecret takes precedence.
  apiToken: ""
  existingSecret: ""
  apiEnabled: false
  apiBindAddress: "0.0.0.0:9001"
  nodeIdFile: "/data/graylog-forwarder/node-id"
  dataDir: "/data/graylog-forwarder/data"
  journal:
    dir: "/data/graylog-forwarder/journal"
    maxAge: "12h"
    maxSize: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
containerSecurityContext: {}

service:
  type: ClusterIP
  annotations: {}
  ports:
    forwarderConfig: 5555
    gelf: 12201
    api: 9001

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  #  - host: forwarder.example.com
  #    paths:
  #      - path: /
  #        pathType: ImplementationSpecific
  tls: []

resources: {}

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    partition:

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  storageClass: ""
  size: 8Gi
  accessModes:
    - ReadWriteOnce
  annotations: {}
  labels: {}
