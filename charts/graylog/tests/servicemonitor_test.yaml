suite: graylog ServiceMonitor
templates:
  - service/monitor/graylog.yaml
release:
  name: graylog
  namespace: graylog
tests:
  - it: does not render by default
    asserts:
      - hasDocuments:
          count: 0

  - it: does not render when graylog.enabled is false
    set:
      graylog.enabled: false
      graylog.service.metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: fails when metrics are disabled
    set:
      graylog.service.metrics.enabled: false
      graylog.service.metrics.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: graylog.service.metrics.serviceMonitor.enabled requires graylog.service.metrics.enabled=true, otherwise there is no metrics port to scrape.

  - it: renders a ServiceMonitor selecting the Graylog service
    set:
      graylog.service.metrics.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - equal:
          path: metadata.name
          value: graylog-metrics
      - equal:
          path: metadata.namespace
          value: graylog
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: server
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/component: server
            app.kubernetes.io/name: graylog
            app.kubernetes.io/instance: graylog
      - equal:
          path: spec.namespaceSelector.matchNames
          value:
            - graylog
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].scheme
          value: http
      - notExists:
          path: spec.endpoints[0].interval
      - notExists:
          path: spec.endpoints[0].scrapeTimeout
      - notExists:
          path: spec.endpoints[0].honorLabels

  - it: respects nameOverride and namespace
    set:
      graylog.service.metrics.serviceMonitor.enabled: true
      graylog.service.metrics.serviceMonitor.nameOverride: custom-monitor
      graylog.service.metrics.serviceMonitor.namespace: monitoring
    asserts:
      - equal:
          path: metadata.name
          value: custom-monitor
      - equal:
          path: metadata.namespace
          value: monitoring
      # The scrape target stays in the release namespace
      - equal:
          path: spec.namespaceSelector.matchNames
          value:
            - graylog

  - it: adds custom labels and annotations
    set:
      graylog.service.metrics.serviceMonitor.enabled: true
      graylog.service.metrics.serviceMonitor.labels:
        release: kube-prometheus-stack
      graylog.service.metrics.serviceMonitor.annotations:
        example.com/owner: platform
    asserts:
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: metadata.annotations["example.com/owner"]
          value: platform

  - it: renders the scrape settings
    set:
      graylog.service.metrics.serviceMonitor.enabled: true
      graylog.service.metrics.serviceMonitor.interval: 30s
      graylog.service.metrics.serviceMonitor.scrapeTimeout: 10s
      graylog.service.metrics.serviceMonitor.honorLabels: true
      graylog.service.metrics.serviceMonitor.path: /custom-metrics
      graylog.service.metrics.serviceMonitor.scheme: https
      graylog.service.metrics.serviceMonitor.jobLabel: app.kubernetes.io/name
      graylog.service.metrics.serviceMonitor.targetLabels:
        - app.kubernetes.io/instance
      graylog.service.metrics.serviceMonitor.podTargetLabels:
        - app
      graylog.service.metrics.serviceMonitor.tlsConfig:
        insecureSkipVerify: true
      graylog.service.metrics.serviceMonitor.bearerTokenSecret:
        name: graylog-scrape-token
        key: token
      graylog.service.metrics.serviceMonitor.relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
      graylog.service.metrics.serviceMonitor.metricRelabelings:
        - action: drop
          regex: jvm_.*
          sourceLabels: [__name__]
    asserts:
      - equal:
          path: spec.jobLabel
          value: app.kubernetes.io/name
      - equal:
          path: spec.targetLabels
          value:
            - app.kubernetes.io/instance
      - equal:
          path: spec.podTargetLabels
          value:
            - app
      - equal:
          path: spec.endpoints[0].interval
          value: 30s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 10s
      - equal:
          path: spec.endpoints[0].honorLabels
          value: true
      - equal:
          path: spec.endpoints[0].path
          value: /custom-metrics
      - equal:
          path: spec.endpoints[0].scheme
          value: https
      - equal:
          path: spec.endpoints[0].tlsConfig.insecureSkipVerify
          value: true
      - equal:
          path: spec.endpoints[0].bearerTokenSecret
          value:
            name: graylog-scrape-token
            key: token
      - equal:
          path: spec.endpoints[0].relabelings[0].targetLabel
          value: pod
      - equal:
          path: spec.endpoints[0].metricRelabelings[0].action
          value: drop
