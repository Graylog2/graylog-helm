suite: Graylog metrics exporter and ServiceMonitor
templates:
  - monitoring/servicemonitor-graylog.yaml
  - service/graylog.yaml
  - config/graylog.yaml
release:
  name: graylog
  namespace: graylog
tests:
  # --- exporter bind address ---
  # Graylog defaults to 127.0.0.1:9833, which is unreachable from outside the pod and
  # ignores graylog.service.ports.metrics. The chart always binds it explicitly.
  - it: binds the exporter to localhost by default
    template: config/graylog.yaml
    asserts:
      - equal:
          path: data.GRAYLOG_PROMETHEUS_EXPORTER_ENABLED
          value: "true"
      - equal:
          path: data.GRAYLOG_PROMETHEUS_EXPORTER_BIND_ADDRESS
          value: "127.0.0.1:9833"

  - it: binds the exporter to the pod when exposed
    template: config/graylog.yaml
    set:
      graylog.service.metrics.expose: true
    asserts:
      - equal:
          path: data.GRAYLOG_PROMETHEUS_EXPORTER_BIND_ADDRESS
          value: "0.0.0.0:9833"

  - it: honours a custom metrics port in the bind address
    template: config/graylog.yaml
    set:
      graylog.service.metrics.expose: true
      graylog.service.ports.metrics: 9999
    asserts:
      - equal:
          path: data.GRAYLOG_PROMETHEUS_EXPORTER_BIND_ADDRESS
          value: "0.0.0.0:9999"

  - it: sets no bind address when the exporter is off
    template: config/graylog.yaml
    set:
      graylog.service.metrics.enabled: false
      graylog.lifecycle.preStopDrain.enabled: false
    asserts:
      - equal:
          path: data.GRAYLOG_PROMETHEUS_EXPORTER_ENABLED
          value: "false"
      - notExists:
          path: data.GRAYLOG_PROMETHEUS_EXPORTER_BIND_ADDRESS

  # --- service port ---
  - it: does not publish the metrics port unless exposed
    template: service/graylog.yaml
    asserts:
      - notContains:
          path: spec.ports
          content:
            name: metrics
            port: 9833
            targetPort: metrics
            protocol: TCP

  - it: publishes the metrics port when exposed
    template: service/graylog.yaml
    set:
      graylog.service.metrics.expose: true
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9833
            targetPort: metrics
            protocol: TCP

  # --- ServiceMonitor ---
  - it: renders no ServiceMonitor by default
    template: monitoring/servicemonitor-graylog.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor selecting the Graylog Service
    template: monitoring/servicemonitor-graylog.yaml
    set:
      graylog.service.metrics.expose: true
      graylog.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: graylog-servicemonitor
      - equal:
          path: spec.selector.matchLabels['app.kubernetes.io/component']
          value: server
      - equal:
          path: spec.selector.matchLabels['app.kubernetes.io/instance']
          value: graylog
      - equal:
          path: spec.namespaceSelector.matchNames[0]
          value: graylog
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 30s

  - it: passes through labels, relabelings and a namespace selector
    template: monitoring/servicemonitor-graylog.yaml
    set:
      graylog.service.metrics.expose: true
      graylog.serviceMonitor.enabled: true
      graylog.serviceMonitor.labels:
        release: kube-prometheus-stack
      graylog.serviceMonitor.honorLabels: true
      graylog.serviceMonitor.namespaceSelector:
        any: true
      graylog.serviceMonitor.metricRelabelings:
        - action: drop
          regex: jvm_.*
          sourceLabels: [__name__]
    asserts:
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: spec.namespaceSelector.any
          value: true
      - equal:
          path: spec.endpoints[0].honorLabels
          value: true
      - equal:
          path: spec.endpoints[0].metricRelabelings[0].regex
          value: jvm_.*

  # --- guardrails ---
  # NOTE: helm-unittest matches errorPattern against the LAST line of a multi-line
  # `fail` message only, so these assert on the closing remediation line.
  - it: fails when the ServiceMonitor is enabled but the exporter is not exposed
    template: monitoring/servicemonitor-graylog.yaml
    set:
      graylog.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'restrict access with a NetworkPolicy'

  - it: fails when the ServiceMonitor is enabled but the exporter is off
    template: monitoring/servicemonitor-graylog.yaml
    set:
      graylog.serviceMonitor.enabled: true
      graylog.service.metrics.enabled: false
      graylog.lifecycle.preStopDrain.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: 'GRAYLOG_PROMETHEUS_EXPORTER_ENABLED'
