suite: PodDisruptionBudgets
templates:
  - policy/pdb/graylog.yaml
  - policy/pdb/datanode.yaml
release:
  name: graylog
  namespace: graylog
tests:
  # --- Graylog PDB ---
  - it: is rendered by default (podDisruptionBudget enabled, replicas 2)
    template: policy/pdb/graylog.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.minAvailable
          value: 1

  - it: is not rendered when podDisruptionBudget is explicitly disabled
    template: policy/pdb/graylog.yaml
    set:
      graylog.podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders when enabled and replicas >= 2
    template: policy/pdb/graylog.yaml
    set:
      graylog.podDisruptionBudget.enabled: true
      graylog.replicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: metadata.name
          value: graylog-pdb
      - equal:
          path: metadata.namespace
          value: graylog
      - equal:
          path: spec.minAvailable
          value: 1
      - equal:
          path: spec.selector.matchLabels.app
          value: graylog-app

  - it: is not rendered when enabled but replicas < 2
    template: policy/pdb/graylog.yaml
    set:
      graylog.podDisruptionBudget.enabled: true
      graylog.replicas: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: honors graylog.podDisruptionBudget.minAvailable
    template: policy/pdb/graylog.yaml
    set:
      graylog.podDisruptionBudget.enabled: true
      graylog.replicas: 3
      graylog.podDisruptionBudget.minAvailable: 2
    asserts:
      - equal:
          path: spec.minAvailable
          value: 2

  - it: uses maxUnavailable instead of minAvailable when set
    template: policy/pdb/graylog.yaml
    set:
      graylog.podDisruptionBudget.enabled: true
      graylog.replicas: 3
      graylog.podDisruptionBudget.maxUnavailable: "25%"
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: "25%"
      - notExists:
          path: spec.minAvailable

  - it: is not rendered when graylog.enabled is false
    template: policy/pdb/graylog.yaml
    set:
      graylog.enabled: false
      graylog.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  # --- Datanode PDB ---
  - it: datanode PDB is not rendered when explicitly disabled
    template: policy/pdb/datanode.yaml
    set:
      datanode.podDisruptionBudget.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: datanode PDB renders by default (enabled, replicas 3)
    template: policy/pdb/datanode.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: graylog-pdb-datanode
      - equal:
          path: spec.selector.matchLabels.app
          value: graylog-datanode
      # default minAvailable comes from values.yaml (2)
      - equal:
          path: spec.minAvailable
          value: 2

  - it: datanode PDB renders when enabled with a single replica
    template: policy/pdb/datanode.yaml
    set:
      datanode.podDisruptionBudget.enabled: true
      datanode.replicas: 1
    asserts:
      - hasDocuments:
          count: 1

  # The node-group replica count is summed straight from values, with no
  # `| default 3` fallback to coerce an explicit 0 back to 3, so replicas:0
  # really does switch the `ge replicas 1` guard off.
  - it: datanode replicas 0 renders no PDB
    template: policy/pdb/datanode.yaml
    set:
      datanode.podDisruptionBudget.enabled: true
      datanode.replicas: 0
    asserts:
      - hasDocuments:
          count: 0

  - it: datanode PDB is not rendered when datanode.enabled is false
    template: policy/pdb/datanode.yaml
    set:
      datanode.enabled: false
      datanode.podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 0

  - it: honors datanode.podDisruptionBudget.minAvailable
    template: policy/pdb/datanode.yaml
    set:
      datanode.podDisruptionBudget.enabled: true
      datanode.podDisruptionBudget.minAvailable: 1
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1

  - it: uses maxUnavailable instead of minAvailable when set
    template: policy/pdb/datanode.yaml
    set:
      datanode.podDisruptionBudget.enabled: true
      datanode.podDisruptionBudget.maxUnavailable: 1
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  # --- Datanode PDB: consolidated across node groups ---
  - it: renders one PDB per group by default when extraNodeGroups is set
    template: policy/pdb/datanode.yaml
    set:
      datanode.extraNodeGroups:
        search:
          roles: [search]
          replicas: 2
    asserts:
      - hasDocuments:
          count: 2
      - matchRegex:
          path: spec.selector.matchLabels.graylog-datanode-group
          pattern: ^(default|search)$

  - it: renders a single PDB spanning all groups when consolidated is true
    template: policy/pdb/datanode.yaml
    set:
      datanode.podDisruptionBudget.consolidated: true
      datanode.extraNodeGroups:
        search:
          roles: [search]
          replicas: 2
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: graylog-pdb-datanode
      - equal:
          path: spec.selector.matchLabels.app
          value: graylog-datanode
      - notExists:
          path: spec.selector.matchLabels.graylog-datanode-group
      - equal:
          path: spec.minAvailable
          value: 2

  - it: consolidated PDB uses maxUnavailable instead of minAvailable when set
    template: policy/pdb/datanode.yaml
    set:
      datanode.podDisruptionBudget.consolidated: true
      datanode.podDisruptionBudget.maxUnavailable: "10%"
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: "10%"
      - notExists:
          path: spec.minAvailable

  - it: consolidated PDB honors its own minAvailable
    template: policy/pdb/datanode.yaml
    set:
      datanode.podDisruptionBudget.consolidated: true
      datanode.podDisruptionBudget.minAvailable: 5
    asserts:
      - equal:
          path: spec.minAvailable
          value: 5

  - it: consolidated PDB is not rendered when total replicas across groups is 0
    template: policy/pdb/datanode.yaml
    set:
      datanode.podDisruptionBudget.consolidated: true
      datanode.replicas: 0
    asserts:
      - hasDocuments:
          count: 0
