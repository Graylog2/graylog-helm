suite: datanode Service
templates:
  - service/datanode.yaml
release:
  name: graylog
  namespace: graylog
tests:
  - it: does not render when datanode.enabled is false
    set:
      datanode.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a headless Service with the expected name
    asserts:
      - isKind:
          of: Service
      - equal:
          path: metadata.name
          value: graylog-datanode-svc
      - equal:
          path: spec.clusterIP
          value: None

  - it: exposes the default api/data/config ports
    asserts:
      - contains:
          path: spec.ports
          content:
            name: api
            port: 8999
      - contains:
          path: spec.ports
          content:
            name: data
            port: 9200
      - contains:
          path: spec.ports
          content:
            name: config
            port: 9300

  - it: honors custom datanode service ports
    set:
      datanode.service.ports.api: 18999
      datanode.service.ports.data: 19200
      datanode.service.ports.config: 19300
    asserts:
      - contains:
          path: spec.ports
          content:
            name: api
            port: 18999
      - contains:
          path: spec.ports
          content:
            name: data
            port: 19200
      - contains:
          path: spec.ports
          content:
            name: config
            port: 19300

  - it: selects datanode pods
    asserts:
      - equal:
          path: spec.selector.app
          value: graylog-datanode

  - it: does not publish the metrics port by default
    asserts:
      - notContains:
          path: spec.ports
          content:
            name: metrics
            port: 9114

  - it: publishes the metrics port when the exporter is enabled
    set:
      datanode.metrics.enabled: true
      datanode.metrics.adminDN: "CN=metrics-exporter"
      datanode.metrics.existingSecretName: datanode-metrics-cert
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 9114

  - it: honors a custom metrics port
    set:
      datanode.metrics.enabled: true
      datanode.metrics.adminDN: "CN=metrics-exporter"
      datanode.metrics.existingSecretName: datanode-metrics-cert
      datanode.service.ports.metrics: 19114
    asserts:
      - contains:
          path: spec.ports
          content:
            name: metrics
            port: 19114
