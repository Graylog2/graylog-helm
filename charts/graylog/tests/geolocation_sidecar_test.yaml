suite: GeoIP sidecar container
# Moved up from tests/unit/ — the default glob `tests/*_test.yaml` is
# non-recursive, so suites in subdirectories are silently skipped by CI.
templates:
  - workload/statefulsets/graylog.yaml
  - config/geoip-sidecar-entrypoint.yaml
  - config/secret/secrets.yaml
  # The StatefulSet's checksum helpers `include` these templates by path, so
  # helm-unittest's template filter has to list them for the includes to resolve.
  - config/graylog.yaml
  - config/datanode.yaml
release:
  name: graylog
  namespace: graylog
tests:
  - it: renders the sidecar when geolocation is enabled with credentials
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
    template: workload/statefulsets/graylog.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: geoip-updater
          any: true
      - equal:
          path: spec.template.spec.containers[1].image
          value: "maxmindinc/geoipupdate:7.1.1"

  - it: does not render the sidecar when geolocation is disabled
    set:
      graylog.config.geolocation.enabled: false
    template: workload/statefulsets/graylog.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers
          content:
            name: geoip-updater
          any: true

  - it: does not render the sidecar when sidecar.enabled is false
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: false
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
    template: workload/statefulsets/graylog.yaml
    asserts:
      - notContains:
          path: spec.template.spec.containers
          content:
            name: geoip-updater
          any: true

  - it: sets the sidecar environment variables
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
      graylog.config.geolocation.maxmindGeoIp.editionIds: "GeoIP2-City GeoIP2-ISP"
      graylog.config.geolocation.sidecar.schedule: "*/6 * * * *"
    template: workload/statefulsets/graylog.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GEOIPUPDATE_EDITION_IDS
            value: "GeoIP2-City GeoIP2-ISP"
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GEOIP_SCHEDULE
            value: "*/6 * * * *"
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GEOIPUPDATE_DB_DIR
            value: /usr/share/data/geolocation

  - it: references the MaxMind keys of the chart-managed secret
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
    template: workload/statefulsets/graylog.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].env[0].valueFrom.secretKeyRef.key
          value: GEO_IP_MAXMIND_ACCOUNT_ID
      - equal:
          path: spec.template.spec.containers[1].env[0].valueFrom.secretKeyRef.name
          value: graylog-secrets
      - equal:
          path: spec.template.spec.containers[1].env[1].valueFrom.secretKeyRef.key
          value: GEO_IP_MAXMIND_LICENSE_KEY

  - it: mounts the database, tmp and entrypoint volumes in the sidecar
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
    template: workload/statefulsets/graylog.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: geoip-tmp
            mountPath: /tmp
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: geoip-entrypoint
            mountPath: /geoip-scripts
            readOnly: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: graylog-data
            mountPath: /usr/share/data/geolocation
            subPath: geolocation

  - it: applies the sidecar securityContext and resources
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
    template: workload/statefulsets/graylog.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[1].securityContext.capabilities.drop
          content: ALL
      - equal:
          path: spec.template.spec.containers[1].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[1].resources.limits.cpu
          value: 500m

  - it: runs the entrypoint script from the ConfigMap
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
    template: workload/statefulsets/graylog.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[1].command[0]
          value: /bin/sh
      - equal:
          path: spec.template.spec.containers[1].command[1]
          value: /geoip-scripts/entrypoint.sh

  - it: adds the geoip volumes to the StatefulSet
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
    template: workload/statefulsets/graylog.yaml
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: geoip-entrypoint
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: geoip-tmp
            emptyDir: {}

  - it: creates the geoip entrypoint ConfigMap
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
    template: config/geoip-sidecar-entrypoint.yaml
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: graylog-geoip-entrypoint
      - isNotNull:
          path: data["entrypoint.sh"]

  - it: does not create the entrypoint ConfigMap when geolocation is disabled
    set:
      graylog.config.geolocation.enabled: false
    template: config/geoip-sidecar-entrypoint.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: includes the MaxMind credentials in the secret when provided
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
    template: config/secret/secrets.yaml
    documentIndex: 1
    asserts:
      - matchRegex:
          path: data.GEO_IP_MAXMIND_ACCOUNT_ID
          pattern: "^[A-Za-z0-9+/]+={0,2}$"
      - matchRegex:
          path: data.GEO_IP_MAXMIND_LICENSE_KEY
          pattern: "^[A-Za-z0-9+/]+={0,2}$"

  - it: omits the MaxMind credentials when they are not provided
    set:
      graylog.config.geolocation.enabled: true
      # without credentials the sidecar fails the whole render by design
      graylog.config.geolocation.sidecar.enabled: false
    template: config/secret/secrets.yaml
    documentIndex: 1
    asserts:
      - notExists:
          path: data.GEO_IP_MAXMIND_ACCOUNT_ID
      - notExists:
          path: data.GEO_IP_MAXMIND_LICENSE_KEY

  - it: reads the credentials from an external secret when one is configured
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      global.existingSecretName: my-external-secret
      graylog.config.mongodb.customUri: mongodb://mongo:27017/graylog
      mongodb.communityResource.enabled: false
    template: workload/statefulsets/graylog.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: geoip-updater
          any: true
      - equal:
          path: spec.template.spec.containers[1].env[0].valueFrom.secretKeyRef.name
          value: my-external-secret

  - it: fails when the sidecar is enabled without credentials
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
    template: workload/statefulsets/graylog.yaml
    asserts:
      - failedTemplate:
          errorPattern: "GeoIP sidecar is enabled but MaxMind credentials are not provided"

  - it: labels the sidecar entrypoint ConfigMap like the other Graylog objects
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
      graylog.labels.tier: backend
      global.commonAnnotations.owner: platform-team
    template: config/geoip-sidecar-entrypoint.yaml
    asserts:
      - equal:
          path: metadata.labels.tier
          value: backend
      - equal:
          path: metadata.labels.app
          value: graylog-app
      - equal:
          path: metadata.annotations.owner
          value: platform-team

  - it: keeps user sidecars after the geoip sidecar
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "maxmind-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "maxmind-license"
      graylog.extraContainers:
        - name: log-shipper
          image: busybox:1.37
    template: workload/statefulsets/graylog.yaml
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 3
      - equal:
          path: spec.template.spec.containers[1].name
          value: geoip-updater
      - equal:
          path: spec.template.spec.containers[2].name
          value: log-shipper
