suite: GeoIP Sidecar Container Tests
templates:
  - workload/statefulsets/graylog.yaml
  - config/graylog.yaml # checksum/config dependency
  - config/geoip-sidecar-entrypoint.yaml
  - config/secret/secrets.yaml

tests:
  # Test: Sidecar renders when geolocation enabled with credentials
  - it: should render sidecar when geolocation enabled with credentials
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - contains:
          path: spec.template.spec.containers
          content:
            name: geoip-updater
          any: true
      - equal:
          path: spec.template.spec.containers[1].image
          value: "maxmindinc/geoipupdate:7.1.1"
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: IfNotPresent

  # Test: Sidecar image is fully overridable
  - it: should honor sidecar image repository, tag and pull policy overrides
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
      graylog.config.geolocation.sidecar.image.repository: "registry.example.com/mirror/geoipupdate"
      graylog.config.geolocation.sidecar.image.tag: "7.0.0"
      graylog.config.geolocation.sidecar.image.imagePullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[1].image
          value: "registry.example.com/mirror/geoipupdate:7.0.0"
      - equal:
          path: spec.template.spec.containers[1].imagePullPolicy
          value: Always

  # Test: legacy repository/name split still renders the same image
  - it: should append the deprecated image.name to the repository
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
      graylog.config.geolocation.sidecar.image.repository: "maxmindinc"
      graylog.config.geolocation.sidecar.image.name: "geoipupdate"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].image
          value: "maxmindinc/geoipupdate:7.1.1"

  # Test: sidecar pull secrets are added to the pod
  - it: should add sidecar imagePullSecrets to the pod
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
      graylog.image.imagePullSecrets:
        - name: graylog-pull
      graylog.config.geolocation.sidecar.image.imagePullSecrets:
        - name: geoip-pull
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: graylog-pull
            - name: geoip-pull

  # Test: sidecar pull secrets are not added when the sidecar is disabled
  - it: should not add sidecar imagePullSecrets when sidecar is disabled
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: false
      graylog.config.geolocation.sidecar.image.imagePullSecrets:
        - name: geoip-pull
    asserts:
      - isNull:
          path: spec.template.spec.imagePullSecrets

  # Test: Sidecar not rendered when geolocation disabled
  - it: should not render sidecar when geolocation disabled
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers
          content:
            name: geoip-updater
          any: true

  # Test: Sidecar not rendered when explicitly disabled
  - it: should not render sidecar when sidecar.enabled is false
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: false
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - notContains:
          path: spec.template.spec.containers
          content:
            name: geoip-updater
          any: true

  # Test: Sidecar environment variables correct
  - it: should set correct environment variables
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
      graylog.config.geolocation.maxmindGeoIp.editionIds: "GeoIP2-City GeoIP2-ISP"
      graylog.config.geolocation.sidecar.schedule: "*/6 * * * *"
    asserts:
      # Match by env var name rather than positional index so the assertions
      # stay valid if the sidecar's env ordering changes.
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GEOIPUPDATE_EDITION_IDS
            value: "GeoIP2-City GeoIP2-ISP"
          any: true
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GEOIP_SCHEDULE
            value: "*/6 * * * *"
          any: true

  # Test: Secret references correct key names
  - it: should reference correct secret keys in sidecar
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GEOIPUPDATE_ACCOUNT_ID
            valueFrom:
              secretKeyRef:
                key: GEO_IP_MAXMIND_ACCOUNT_ID
                name: RELEASE-NAME-graylog-secrets
          any: true
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GEOIPUPDATE_LICENSE_KEY
            valueFrom:
              secretKeyRef:
                key: GEO_IP_MAXMIND_LICENSE_KEY
                name: RELEASE-NAME-graylog-secrets
          any: true

  # Test: Volume mounts present
  - it: should mount required volumes in sidecar
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: geoip-tmp
            mountPath: /tmp
          any: true
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: geoip-entrypoint
            mountPath: /geoip-scripts
            readOnly: true
          any: true

  # Test: Security context applied
  - it: should apply security context to sidecar
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: false
      - contains:
          path: spec.template.spec.containers[1].securityContext.capabilities.drop
          content: ALL

  # Test: Resources configured
  - it: should set resource requests and limits
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].resources.requests.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[1].resources.limits.cpu
          value: "500m"

  # Test: Entrypoint ConfigMap created
  - it: should create geoip entrypoint ConfigMap
    template: config/geoip-sidecar-entrypoint.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: "RELEASE-NAME-graylog-geoip-entrypoint"
      - isNotNull:
          path: data["entrypoint.sh"]

  # Test: Entrypoint ConfigMap not created when geolocation disabled
  - it: should not create entrypoint ConfigMap when geolocation disabled
    template: config/geoip-sidecar-entrypoint.yaml
    set:
      graylog.config.geolocation.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  # Test: Secret includes MaxMind credentials
  - it: should include MaxMind credentials in secret when provided
    template: config/secret/secrets.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "my-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "my-key"
    asserts:
      # documentIndex 1 = the main graylog secret (index 0 is the backup secret)
      - isNotNull:
          path: data.GEO_IP_MAXMIND_ACCOUNT_ID
        documentIndex: 1
      - isNotNull:
          path: data.GEO_IP_MAXMIND_LICENSE_KEY
        documentIndex: 1

  # Test: Secret excludes MaxMind credentials when not provided
  - it: should not include MaxMind credentials when not provided
    template: config/secret/secrets.yaml
    set:
      graylog.config.geolocation.enabled: true
      # sidecar disabled so the StatefulSet (also rendered by this suite) does
      # not fail its credential validation while we assert on the secret
      graylog.config.geolocation.sidecar.enabled: false
    asserts:
      - notExists:
          path: data.GEO_IP_MAXMIND_ACCOUNT_ID
        documentIndex: 1
      - notExists:
          path: data.GEO_IP_MAXMIND_LICENSE_KEY
        documentIndex: 1

  # Test: Volumes added to StatefulSet
  - it: should add geoip volumes to StatefulSet
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: geoip-entrypoint
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: geoip-tmp
            emptyDir: {}
          any: true

  # Test: Custom schedule applied
  - it: should apply custom schedule to GEOIP_SCHEDULE env var
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
      graylog.config.geolocation.sidecar.schedule: "0 2 * * *"
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: GEOIP_SCHEDULE
            value: "0 2 * * *"
          any: true

  # Test: Command points to entrypoint script
  - it: should execute entrypoint.sh script
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].command[0]
          value: "/bin/sh"
      - equal:
          path: spec.template.spec.containers[1].command[1]
          value: "/geoip-scripts/entrypoint.sh"

  # Test: credentials can come from a dedicated external secret
  - it: should read credentials from maxmindGeoIp.existingSecret
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.existingSecret: "my-geoip-secret"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].env[0].valueFrom.secretKeyRef
          value:
            name: "my-geoip-secret"
            key: "GEO_IP_MAXMIND_ACCOUNT_ID"
      - equal:
          path: spec.template.spec.containers[1].env[1].valueFrom.secretKeyRef
          value:
            name: "my-geoip-secret"
            key: "GEO_IP_MAXMIND_LICENSE_KEY"

  # Test: custom key names in the external secret
  - it: should honor custom key names in the external secret
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.existingSecret: "my-geoip-secret"
      graylog.config.geolocation.maxmindGeoIp.accountIdKey: "accountId"
      graylog.config.geolocation.maxmindGeoIp.licenseKeyKey: "licenseKey"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].env[0].valueFrom.secretKeyRef.key
          value: "accountId"
      - equal:
          path: spec.template.spec.containers[1].env[1].valueFrom.secretKeyRef.key
          value: "licenseKey"

  # Test: inline credentials still come from the chart-managed secret
  - it: should read inline credentials from the chart-managed secret
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].env[0].valueFrom.secretKeyRef.name
          value: "RELEASE-NAME-graylog-secrets"

  # Test: the primary external secret is no longer expected to hold the credentials
  - it: should fail when only global.existingSecretName is set
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      global.existingSecretName: "my-external-secret"
      # An external secret requires external MongoDB too — the chart rejects
      # pairing it with the chart-managed MongoDB CR, since the CR would
      # reference a backup secret that is never created (C-06).
      mongodb.communityResource.enabled: false
      graylog.config.mongodb.customUri: "mongodb://user:pass@host:27017/graylog"
    asserts:
      - failedTemplate:
          errorPattern: "GeoIP sidecar is enabled but MaxMind credentials are not provided"

  # Test: global.existingSecretName + a dedicated GeoIP secret works
  - it: should pair global.existingSecretName with a dedicated GeoIP secret
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.existingSecret: "my-geoip-secret"
      global.existingSecretName: "my-external-secret"
      mongodb.communityResource.enabled: false
      graylog.config.mongodb.customUri: "mongodb://user:pass@host:27017/graylog"
    asserts:
      - equal:
          path: spec.template.spec.containers[1].env[0].valueFrom.secretKeyRef.name
          value: "my-geoip-secret"

  # Test: inline credentials are rejected when the chart manages no secret
  - it: should reject inline credentials alongside global.existingSecretName
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.accountId: "test-account"
      graylog.config.geolocation.maxmindGeoIp.licenseKey: "test-key"
      global.existingSecretName: "my-external-secret"
      mongodb.communityResource.enabled: false
      graylog.config.mongodb.customUri: "mongodb://user:pass@host:27017/graylog"
    asserts:
      - failedTemplate:
          errorPattern: "cannot be used with global.existingSecretName"

  # Test: chart-managed secret stays free of MaxMind keys when using existingSecret
  - it: should not store MaxMind credentials when existingSecret is used
    template: config/secret/secrets.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
      graylog.config.geolocation.maxmindGeoIp.existingSecret: "my-geoip-secret"
    asserts:
      - notExists:
          path: data.GEO_IP_MAXMIND_ACCOUNT_ID
        documentIndex: 1
      - notExists:
          path: data.GEO_IP_MAXMIND_LICENSE_KEY
        documentIndex: 1

  # Test: Missing credentials causes validation failure
  - it: should fail when credentials missing
    template: workload/statefulsets/graylog.yaml
    set:
      graylog.config.geolocation.enabled: true
      graylog.config.geolocation.sidecar.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "GeoIP sidecar is enabled but MaxMind credentials are not provided"
