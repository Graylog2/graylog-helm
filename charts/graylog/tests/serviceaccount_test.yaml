suite: ServiceAccount and RBAC
templates:
  - auth/sa.yaml
  - auth/mongo-sa.yaml
  - auth/datanode-sa.yaml
release:
  name: graylog
  namespace: graylog
tests:
  # --- Graylog ServiceAccount (auth/sa.yaml) ---
  - it: renders the graylog ServiceAccount by default
    template: auth/sa.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: graylog-sa
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: does not render when serviceAccount.create is false
    template: auth/sa.yaml
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: honors serviceAccount.nameOverride
    template: auth/sa.yaml
    documentIndex: 0
    set:
      serviceAccount.nameOverride: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa

  - it: honors an explicit serviceAccount.automount false
    template: auth/sa.yaml
    documentIndex: 0
    set:
      serviceAccount.automount: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: applies serviceAccount.annotations
    template: auth/sa.yaml
    documentIndex: 0
    set:
      serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::123:role/graylog
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::123:role/graylog

  - it: does not render Role/RoleBinding by default
    template: auth/sa.yaml
    asserts:
      # Only the ServiceAccount document is produced
      - hasDocuments:
          count: 1

  - it: renders Role and RoleBinding when role.create with rules
    template: auth/sa.yaml
    set:
      serviceAccount.role.create: true
      serviceAccount.role.rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get"]
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Role
        documentIndex: 1
      - isKind:
          of: RoleBinding
        documentIndex: 2
      - equal:
          path: metadata.name
          value: graylog-sa-role
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: graylog-sa
        documentIndex: 2
      - equal:
          path: roleRef.name
          value: graylog-sa-role
        documentIndex: 2

  - it: does not render Role when role.create is true but rules are empty
    template: auth/sa.yaml
    set:
      serviceAccount.role.create: true
      serviceAccount.role.rules: []
    asserts:
      - hasDocuments:
          count: 1

  # --- MongoDB ServiceAccount (auth/mongo-sa.yaml) ---
  - it: renders the mongodb ServiceAccount by default
    template: auth/mongo-sa.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: graylog-mongo-sa

  - it: renders mongodb Role and RoleBinding by default (rules pre-populated)
    template: auth/mongo-sa.yaml
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: graylog-mongo-sa-role
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: graylog-mongo-sa
        documentIndex: 2

  - it: does not render mongodb SA when create is false
    template: auth/mongo-sa.yaml
    set:
      mongodb.serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0

  - it: honors mongodb serviceAccount.nameOverride
    template: auth/mongo-sa.yaml
    documentIndex: 0
    set:
      mongodb.serviceAccount.nameOverride: custom-mongo-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-mongo-sa

  # --- Datanode ServiceAccount (auth/datanode-sa.yaml) ---
  - it: does not render a datanode ServiceAccount by default
    template: auth/datanode-sa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the datanode ServiceAccount when create is true
    template: auth/datanode-sa.yaml
    documentIndex: 0
    set:
      datanode.serviceAccount.create: true
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: graylog-datanode-sa
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: datanode
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: carries IRSA annotations onto the datanode ServiceAccount
    template: auth/datanode-sa.yaml
    documentIndex: 0
    set:
      datanode.serviceAccount.create: true
      datanode.serviceAccount.annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::111122223333:role/datanode
    asserts:
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::111122223333:role/datanode

  - it: honors an explicit datanode serviceAccount.automount false
    template: auth/datanode-sa.yaml
    documentIndex: 0
    set:
      datanode.serviceAccount.create: true
      datanode.serviceAccount.automount: false
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  - it: honors datanode serviceAccount.nameOverride
    template: auth/datanode-sa.yaml
    documentIndex: 0
    set:
      datanode.serviceAccount.create: true
      datanode.serviceAccount.nameOverride: custom-datanode-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-datanode-sa

  - it: does not render a datanode ServiceAccount when the datanode is disabled
    template: auth/datanode-sa.yaml
    set:
      datanode.enabled: false
      opensearch.enabled: true
      opensearch.hosts: ["http://opensearch:9200"]
      datanode.serviceAccount.create: true
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a datanode Role and RoleBinding when rules are supplied
    template: auth/datanode-sa.yaml
    set:
      datanode.serviceAccount.create: true
      datanode.serviceAccount.role.create: true
      datanode.serviceAccount.role.rules:
        - apiGroups: [""]
          resources: ["pods"]
          verbs: ["get"]
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: graylog-datanode-sa-role
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: graylog-datanode-sa
        documentIndex: 2

  - it: does not render a datanode Role when create is true but rules are empty
    template: auth/datanode-sa.yaml
    set:
      datanode.serviceAccount.create: true
      datanode.serviceAccount.role.create: true
      datanode.serviceAccount.role.rules: []
    asserts:
      - hasDocuments:
          count: 1
