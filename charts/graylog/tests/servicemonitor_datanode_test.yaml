suite: Datanode ServiceMonitor
templates:
  - monitoring/servicemonitor-datanode.yaml
release:
  name: graylog
  namespace: graylog
tests:
  - it: renders no ServiceMonitor by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a ServiceMonitor selecting the Datanode Service
    set:
      datanode.metrics.enabled: true
      datanode.metrics.adminDN: "CN=metrics-exporter"
      datanode.metrics.existingSecretName: datanode-metrics-cert
      datanode.serviceMonitor.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceMonitor
      - equal:
          path: metadata.name
          value: graylog-datanode-servicemonitor
      - equal:
          path: spec.selector.matchLabels['app.kubernetes.io/component']
          value: datanode
      - equal:
          path: spec.selector.matchLabels['app.kubernetes.io/instance']
          value: graylog
      - equal:
          path: spec.namespaceSelector.matchNames[0]
          value: graylog
      - equal:
          path: spec.endpoints[0].port
          value: metrics
      - equal:
          path: spec.endpoints[0].path
          value: /metrics
      - equal:
          path: spec.endpoints[0].interval
          value: 30s

  - it: passes through labels, relabelings and a namespace selector
    set:
      datanode.metrics.enabled: true
      datanode.metrics.adminDN: "CN=metrics-exporter"
      datanode.metrics.existingSecretName: datanode-metrics-cert
      datanode.serviceMonitor.enabled: true
      datanode.serviceMonitor.labels:
        release: kube-prometheus-stack
      datanode.serviceMonitor.honorLabels: true
      datanode.serviceMonitor.namespaceSelector:
        any: true
      datanode.serviceMonitor.metricRelabelings:
        - action: drop
          regex: jvm_.*
          sourceLabels: [__name__]
    asserts:
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: spec.namespaceSelector.any
          value: true
      - equal:
          path: spec.endpoints[0].honorLabels
          value: true
      - equal:
          path: spec.endpoints[0].metricRelabelings[0].regex
          value: jvm_.*

  # --- guardrails ---
  # NOTE: helm-unittest matches errorPattern against the LAST line of a multi-line
  # `fail` message only, so this asserts on the closing remediation line.
  - it: fails when the ServiceMonitor is enabled but the exporter is off
    set:
      datanode.serviceMonitor.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: 'scrapes the Datanode metrics exporter sidecar'
