suite: graylog Secret root password
templates:
  - config/secret/secrets.yaml
release:
  name: graylog
  namespace: graylog
# sha256("MyChosenPass123"), base64-encoded as the secret stores it.
set:
  graylog.config.rootPassword: MyChosenPass123
tests:
  # `lookup` always returns nothing under helm-unittest, so every case here is the
  # "nothing stored yet" path — equivalent to a fresh install or a `helm template`
  # render. Document 0 is the backup secret, document 1 the live secret. The
  # restore-from-cluster branch of `graylog.storedRootPasswordSha` is unreachable
  # from a unit test; it is covered by `--dry-run=server` against a live release.
  - it: stores the sha256 of an explicitly configured root password
    documentIndex: 1
    asserts:
      - equal:
          path: data.GRAYLOG_ROOT_PASSWORD_SHA2
          value: ZTMwMjAzODA4NjI0OWU4MjE5YWRiNTM0OTNjODU5YTg1ODgxYTM3M2E3YmNhMDA4ODcyNTQ2YzI4MzFmNzllMg==

  # The backup exists so the hash survives deletion of the live secret, so the two
  # must always agree. An explicitly configured password must also never be
  # overridden by a stored hash, or the documented password-reset upgrade silently
  # does nothing.
  - it: backs up the same root password sha as the live secret
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: graylog-backup-secret
      - equal:
          path: data.graylog-root-password-sha2
          value: ZTMwMjAzODA4NjI0OWU4MjE5YWRiNTM0OTNjODU5YTg1ODgxYTM3M2E3YmNhMDA4ODcyNTQ2YzI4MzFmNzllMg==
      - isNotEmpty:
          path: data.graylog-secret
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep

  - it: falls back to a generated password when none is configured
    set:
      graylog.config.rootPassword: ""
    documentIndex: 1
    asserts:
      - isNotEmpty:
          path: data.GRAYLOG_ROOT_PASSWORD_SHA2
      - isNotEmpty:
          path: data.GRAYLOG_PASSWORD_SECRET
      - isNotEmpty:
          path: data.GRAYLOG_MONGODB_URI

  - it: uses the configured root username
    documentIndex: 1
    asserts:
      - equal:
          path: data.GRAYLOG_ROOT_USERNAME
          value: YWRtaW4=

  # C-06: an external secret skips backup-secret creation, but the MongoDB CR
  # still references it, so the operator would hang forever waiting for
  # credentials. Fail at render time instead of silently at runtime.
  - it: fails when an external secret is paired with chart-managed MongoDB
    set:
      global.existingSecretName: my-external-secret
      mongodb.communityResource.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "Option A: External secret \\+ external MongoDB"

  - it: allows an external secret alongside external MongoDB
    set:
      global.existingSecretName: my-external-secret
      mongodb.communityResource.enabled: false
      graylog.config.mongodb.customUri: "mongodb://user:pass@host:27017/graylog"
    asserts:
      # The chart manages no secrets in this mode, so it renders nothing here.
      - hasDocuments:
          count: 0

  - it: still requires a MongoDB URI when MongoDB is external
    set:
      mongodb.communityResource.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "A MongoDB connection URI must be specified"
