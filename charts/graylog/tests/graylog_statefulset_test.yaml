suite: graylog StatefulSet
templates:
  # The StatefulSet's pod-spec annotations reference two checksum helpers that
  # `include` other templates by path. helm-unittest's `templates:` filter must
  # list those dependencies so the includes resolve. Assertions below use the
  # `template:` field to scope each assert to the StatefulSet specifically.
  - workload/statefulsets/graylog.yaml
  - config/graylog.yaml         # checksum/config dependency
  - config/secret/secrets.yaml  # checksum/secret dependency
release:
  name: graylog
  namespace: graylog
tests:
  - it: respects graylog.replicas value
    set:
      graylog.replicas: 3
    asserts:
      - equal:
          path: spec.replicas
          value: 3
        template: workload/statefulsets/graylog.yaml

  - it: mounts tls-creds volume when graylog.config.tls.enabled is true
    set:
      graylog.config.tls.enabled: true
      graylog.config.tls.secretName: my-tls-secret
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-creds
            secret:
              secretName: "my-tls-secret"
        template: workload/statefulsets/graylog.yaml

  - it: mounts tls-creds at /usr/share/graylog/tls when TLS enabled
    set:
      graylog.config.tls.enabled: true
      graylog.config.tls.secretName: my-tls-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-creds
            mountPath: /usr/share/graylog/tls
        template: workload/statefulsets/graylog.yaml

  - it: does NOT mount tls-creds when graylog.config.tls.enabled is false
    set:
      graylog.config.tls.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-creds
            mountPath: /usr/share/graylog/tls
        template: workload/statefulsets/graylog.yaml

  - it: adds init-plugins emptyDir volume when graylog.config.plugins.enabled is true
    set:
      graylog.config.plugins.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: init-plugins
            emptyDir: {}
        template: workload/statefulsets/graylog.yaml

  - it: does NOT add init-plugins volume when graylog.config.plugins.enabled is false
    set:
      graylog.config.plugins.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: init-plugins
            emptyDir: {}
        template: workload/statefulsets/graylog.yaml

  # Regression guard for the imagePullSecrets schema (issue #84): empty by default (ct lint never catches it)
  - it: renders global.imagePullSecrets into the pod spec
    set:
      global.imagePullSecrets:
        - name: my-pull-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: my-pull-secret
        template: workload/statefulsets/graylog.yaml

  - it: prefers graylog.image.imagePullSecrets over global.imagePullSecrets
    set:
      global.imagePullSecrets:
        - name: global-secret
      graylog.image.imagePullSecrets:
        - name: graylog-secret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: graylog-secret
        template: workload/statefulsets/graylog.yaml

  - it: omits imagePullSecrets when none are set
    asserts:
      - notExists:
          path: spec.template.spec.imagePullSecrets
        template: workload/statefulsets/graylog.yaml

  # Security contexts (issue #70): defaults come from values.yaml, each field is overridable
  - it: renders the default pod securityContext
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            runAsUser: 1100
            runAsGroup: 1100
            runAsNonRoot: true
            fsGroup: 1100
            seccompProfile:
              type: RuntimeDefault
        template: workload/statefulsets/graylog.yaml

  - it: omits pod securityContext when graylog.podSecurityContext is set to null
    set:
      graylog.podSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
        template: workload/statefulsets/graylog.yaml

  - it: renders initContainerSecurityContext on the copy-data init container without NET_BIND_SERVICE
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: copy-data
        template: workload/statefulsets/graylog.yaml
      - equal:
          path: spec.template.spec.initContainers[0].securityContext
          value:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        template: workload/statefulsets/graylog.yaml

  - it: omits copy-data securityContext when graylog.initContainerSecurityContext is set to null
    set:
      graylog.initContainerSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.initContainers[0].securityContext
        template: workload/statefulsets/graylog.yaml

  - it: renders containerSecurityContext with NET_BIND_SERVICE on the graylog-app container
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            seccompProfile:
              type: RuntimeDefault
        template: workload/statefulsets/graylog.yaml

  - it: omits graylog-app securityContext when graylog.containerSecurityContext is set to null
    set:
      graylog.containerSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext
        template: workload/statefulsets/graylog.yaml

  - it: defaults readOnlyRootFilesystem to true on copy-plugin init containers
    set:
      graylog.config.plugins.enabled: true
      graylog.plugins:
        - name: my-plugin
          image: example/my-plugin:1.0.0
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: copy-plugin-my-plugin
        template: workload/statefulsets/graylog.yaml
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.readOnlyRootFilesystem
          value: true
        template: workload/statefulsets/graylog.yaml
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.seccompProfile
          value:
            type: RuntimeDefault
        template: workload/statefulsets/graylog.yaml

  # The default is only applied when the key is absent (hasKey), so an explicit
  # false is preserved rather than being overwritten back to true.
  - it: preserves an explicit readOnlyRootFilesystem false on copy-plugin init containers
    set:
      graylog.config.plugins.enabled: true
      graylog.initContainerSecurityContext:
        readOnlyRootFilesystem: false
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      graylog.plugins:
        - name: my-plugin
          image: example/my-plugin:1.0.0
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].securityContext.readOnlyRootFilesystem
          value: false
        template: workload/statefulsets/graylog.yaml

  - it: omits copy-plugin securityContext when graylog.initContainerSecurityContext is set to null
    set:
      graylog.config.plugins.enabled: true
      graylog.initContainerSecurityContext: null
      graylog.plugins:
        - name: my-plugin
          image: example/my-plugin:1.0.0
    asserts:
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: copy-plugin-my-plugin
        template: workload/statefulsets/graylog.yaml
      - notExists:
          path: spec.template.spec.initContainers[1].securityContext
        template: workload/statefulsets/graylog.yaml

  # Service account (chart best practices): create=false + nameOverride means
  # "use this existing, externally managed ServiceAccount"
  - it: uses an existing service account when create is false and nameOverride is set
    set:
      serviceAccount.create: false
      serviceAccount.nameOverride: existing-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa
        template: workload/statefulsets/graylog.yaml

  - it: omits serviceAccountName when create is false and no nameOverride is set
    set:
      serviceAccount.create: false
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: workload/statefulsets/graylog.yaml
