suite: datanode StatefulSet
templates:
  # The StatefulSet's pod-spec annotations reference two checksum helpers that
  # `include` other templates by path. helm-unittest's `templates:` filter must
  # list those dependencies so the includes resolve. Assertions below use the
  # `template:` field to scope each assert to the StatefulSet specifically.
  - workload/statefulsets/datanode.yaml
  - config/datanode.yaml          # checksum/config dependency
  - config/secret/secrets.yaml    # checksum/secret dependency
  - policy/pdb/datanode.yaml      # node-group PDB coverage
release:
  name: graylog
  namespace: graylog
tests:
  # Security contexts (issue #70): defaults come from values.yaml, each field is overridable
  - it: renders the default pod securityContext
    asserts:
      - equal:
          path: spec.template.spec.securityContext
          value:
            fsGroup: 999
            fsGroupChangePolicy: "OnRootMismatch"
            seccompProfile:
              type: RuntimeDefault
        template: workload/statefulsets/datanode.yaml

  - it: omits pod securityContext when datanode.podSecurityContext is set to null
    set:
      datanode.podSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.securityContext
        template: workload/statefulsets/datanode.yaml

  - it: renders containerSecurityContext with the startup capabilities on the datanode container
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: graylog-datanode
        template: workload/statefulsets/datanode.yaml
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
            seccompProfile:
              type: RuntimeDefault
        template: workload/statefulsets/datanode.yaml

  - it: omits datanode container securityContext when datanode.containerSecurityContext is set to null
    set:
      datanode.containerSecurityContext: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].securityContext
        template: workload/statefulsets/datanode.yaml

  # Service account (chart best practices): create=false + nameOverride means
  # "use this existing, externally managed ServiceAccount"
  - it: uses an existing service account when create is false and nameOverride is set
    set:
      serviceAccount.create: false
      serviceAccount.nameOverride: existing-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa
        template: workload/statefulsets/datanode.yaml

  - it: omits serviceAccountName when create is false and no nameOverride is set
    set:
      serviceAccount.create: false
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: workload/statefulsets/datanode.yaml

  # PVC retention. Pinned explicitly rather than left to the Kubernetes default
  # so it cannot drift, matching the Graylog StatefulSet.
  - it: retains the Data Node PVCs on scale-in and on delete by default
    asserts:
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenScaled
          value: Retain
        template: workload/statefulsets/datanode.yaml
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenDeleted
          value: Retain
        template: workload/statefulsets/datanode.yaml

  # Unlike the Graylog StatefulSet, which refuses whenScaled=Delete outright:
  # shard data on a scaled-in Data Node can be rebuilt from replicas, whereas an
  # orphaned Graylog journal is not replayable by anything.
  - it: allows Delete on the Data Node, which the Graylog StatefulSet refuses
    set:
      datanode.persistence.retentionPolicy.whenScaled: Delete
      datanode.persistence.retentionPolicy.whenDeleted: Delete
    asserts:
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenScaled
          value: Delete
        template: workload/statefulsets/datanode.yaml
      - equal:
          path: spec.persistentVolumeClaimRetentionPolicy.whenDeleted
          value: Delete
        template: workload/statefulsets/datanode.yaml
  # ---------------------------------------------------------------------------
  # Node groups (issue #107): role delegation across dedicated StatefulSets.
  # The top-level datanode block is the primary group; datanode.extraNodeGroups
  # (a map keyed by name) adds dedicated groups that inherit and override it.
  # ---------------------------------------------------------------------------

  # Back-compat: empty extraNodeGroups renders one StatefulSet with the legacy
  # (unsuffixed) name, no node-group label, and (with roles unset) no node_roles.
  - it: renders a single legacy-named datanode StatefulSet with no extra groups
    asserts:
      - equal:
          path: metadata.name
          value: graylog-datanode
        template: workload/statefulsets/datanode.yaml
      - notExists:
          path: metadata.labels['graylog-datanode-group']
        template: workload/statefulsets/datanode.yaml
      - notExists:
          path: data.GRAYLOG_DATANODE_NODE_ROLES
        template: config/datanode.yaml

  - it: back-compat seed hosts span the default replica count
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2].name
          value: GRAYLOG_DATANODE_OPENSEARCH_DISCOVERY_SEED_HOSTS
        template: workload/statefulsets/datanode.yaml
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "graylog-datanode-0.graylog-datanode-svc.graylog.svc.cluster.local,graylog-datanode-1.graylog-datanode-svc.graylog.svc.cluster.local,graylog-datanode-2.graylog-datanode-svc.graylog.svc.cluster.local"
        template: workload/statefulsets/datanode.yaml

  - it: emits node_roles on the primary group when datanode.roles is set
    set:
      datanode.roles: [cluster_manager, data, ingest, remote_cluster_client]
    asserts:
      - equal:
          path: data.GRAYLOG_DATANODE_NODE_ROLES
          value: "cluster_manager,data,ingest,remote_cluster_client"
        template: config/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode-config

  - it: labels the primary group `default` once extra groups exist
    set:
      datanode.extraNodeGroups:
        search:
          roles: [data]
          replicas: 2
    asserts:
      - equal:
          path: metadata.labels['graylog-datanode-group']
          value: default
        template: workload/statefulsets/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode
      - equal:
          path: spec.selector.matchLabels['graylog-datanode-group']
          value: default
        template: workload/statefulsets/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode

  - it: renders a StatefulSet per extra group with suffixed name and group label
    set:
      datanode.extraNodeGroups:
        search:
          roles: [data]
          replicas: 2
          config:
            opensearchHeap: "4g"
    asserts:
      - equal:
          path: metadata.labels['graylog-datanode-group']
          value: search
        template: workload/statefulsets/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode-search
      - equal:
          path: spec.replicas
          value: 2
        template: workload/statefulsets/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode-search

  - it: extra group inherits top-level resources it does not override
    set:
      datanode.extraNodeGroups:
        search:
          roles: [data]
          replicas: 2
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 5Gi
        template: workload/statefulsets/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode-search

  - it: emits per-group node_roles and heap in each group's ConfigMap
    set:
      # The search role requires a snapshot repository or the render hard-fails.
      datanode.config.s3ClientDefaultEndpoint: "https://s3.example.com"
      datanode.config.s3ClientDefaultAccessKey: "ak"
      datanode.config.s3ClientDefaultSecretKey: "sk"
      datanode.roles: [cluster_manager, data, ingest, remote_cluster_client]
      datanode.extraNodeGroups:
        search:
          roles: [search]
          config:
            opensearchHeap: "3g"
    asserts:
      - equal:
          path: data.GRAYLOG_DATANODE_NODE_ROLES
          value: "cluster_manager,data,ingest,remote_cluster_client"
        template: config/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode-config
      - equal:
          path: data.GRAYLOG_DATANODE_NODE_ROLES
          value: "search"
        template: config/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode-search-config
      - equal:
          path: data.GRAYLOG_DATANODE_OPENSEARCH_HEAP
          value: "3g"
        template: config/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode-search-config

  - it: seed hosts span the primary and every extra group
    set:
      datanode.replicas: 2
      datanode.extraNodeGroups:
        search:
          roles: [data]
          replicas: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "graylog-datanode-0.graylog-datanode-svc.graylog.svc.cluster.local,graylog-datanode-1.graylog-datanode-svc.graylog.svc.cluster.local,graylog-datanode-search-0.graylog-datanode-svc.graylog.svc.cluster.local"
        template: workload/statefulsets/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode

  - it: supports hyphenated extra group names
    set:
      datanode.extraNodeGroups:
        warm-tier:
          roles: [data]
          replicas: 1
    asserts:
      - equal:
          path: metadata.labels['graylog-datanode-group']
          value: warm-tier
        template: workload/statefulsets/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-datanode-warm-tier

  - it: renders a PDB per group with distinct suffixed names and selectors
    set:
      datanode.podDisruptionBudget.enabled: true
      datanode.extraNodeGroups:
        search:
          roles: [data]
          replicas: 2
    asserts:
      - equal:
          path: spec.selector.matchLabels['graylog-datanode-group']
          value: default
        template: policy/pdb/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-pdb-datanode
      - equal:
          path: spec.selector.matchLabels['graylog-datanode-group']
          value: search
        template: policy/pdb/datanode.yaml
        documentSelector:
          path: metadata.name
          value: graylog-pdb-datanode-search

  # ServiceAccount wiring. The default must keep sharing the Graylog account,
  # because changing it would restart every Datanode pod on upgrade.
  - it: shares the graylog ServiceAccount by default
    template: workload/statefulsets/datanode.yaml
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: graylog-sa

  - it: uses a dedicated ServiceAccount when datanode.serviceAccount.create is true
    template: workload/statefulsets/datanode.yaml
    set:
      datanode.serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: graylog-datanode-sa

  - it: uses an externally managed ServiceAccount via nameOverride
    template: workload/statefulsets/datanode.yaml
    set:
      datanode.serviceAccount.nameOverride: byo-datanode-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: byo-datanode-sa

  - it: keeps its own ServiceAccount when the top-level one is disabled
    template: workload/statefulsets/datanode.yaml
    set:
      serviceAccount.create: false
      datanode.serviceAccount.create: true
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: graylog-datanode-sa

  - it: omits serviceAccountName when no service account is configured at all
    template: workload/statefulsets/datanode.yaml
    set:
      serviceAccount.create: false
      datanode.serviceAccount.create: false
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName

  - it: applies the dedicated ServiceAccount to extra node groups too
    template: workload/statefulsets/datanode.yaml
    documentIndex: 1
    set:
      datanode.serviceAccount.create: true
      datanode.extraNodeGroups:
        warm:
          replicas: 1
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: graylog-datanode-sa

  # The credentials reach the container as explicit env entries rather than a second
  # envFrom, because envFrom cannot rename keys and an existing Secret rarely uses the
  # GRAYLOG_DATANODE_* names.
  - it: reads the S3 credentials from an existing Secret
    template: workload/statefulsets/datanode.yaml
    set:
      datanode.config.s3ClientDefaultEndpoint: "https://s3.us-east-1.amazonaws.com"
      datanode.config.s3ClientDefaultExistingSecret: my-s3-creds
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_SECRET_KEY

  - it: honors custom key names inside the existing Secret
    template: workload/statefulsets/datanode.yaml
    set:
      datanode.config.s3ClientDefaultEndpoint: "https://s3.us-east-1.amazonaws.com"
      datanode.config.s3ClientDefaultExistingSecret: my-s3-creds
      datanode.config.s3ClientDefaultAccessKeyKey: access_key
      datanode.config.s3ClientDefaultSecretKeyKey: secret_key
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: access_key
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: secret_key

  - it: wires the existing Secret into extra node groups too
    template: workload/statefulsets/datanode.yaml
    documentIndex: 1
    set:
      datanode.config.s3ClientDefaultEndpoint: "https://s3.us-east-1.amazonaws.com"
      datanode.config.s3ClientDefaultExistingSecret: my-s3-creds
      datanode.extraNodeGroups:
        search:
          roles: [search]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY

  - it: adds no S3 env entries when no existing Secret is set
    template: workload/statefulsets/datanode.yaml
    set:
      datanode.config.s3ClientDefaultEndpoint: "https://s3.us-east-1.amazonaws.com"
      datanode.config.s3ClientDefaultAccessKey: ak
      datanode.config.s3ClientDefaultSecretKey: sk
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: my-s3-creds
                key: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY

  - it: reads the global S3 Secret with its default AWS key names
    template: workload/statefulsets/datanode.yaml
    set:
      datanode.config.s3ClientDefaultEndpoint: "https://s3.us-east-1.amazonaws.com"
      global.s3.existingSecret: shared-s3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: shared-s3
                key: AWS_ACCESS_KEY_ID
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_SECRET_KEY
            valueFrom:
              secretKeyRef:
                name: shared-s3
                key: AWS_SECRET_ACCESS_KEY

  - it: lets the datanode Secret override the global one
    template: workload/statefulsets/datanode.yaml
    set:
      datanode.config.s3ClientDefaultEndpoint: "https://s3.us-east-1.amazonaws.com"
      global.s3.existingSecret: shared-s3
      datanode.config.s3ClientDefaultExistingSecret: dn-s3
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: dn-s3
                key: GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY
