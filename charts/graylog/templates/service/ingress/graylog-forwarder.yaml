{{- if and .Values.ingress.enabled .Values.ingress.forwarder.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "graylog.fullname" . | printf "%s-forwarder" }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .Values.ingress.forwarder.labels "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.ingress.forwarder.annotations "indent" 2) }}
spec:
  {{- with .Values.ingress.forwarder.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.forwarder.tls }}
  tls:
    {{- range .Values.ingress.forwarder.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.forwarder.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            {{- with .pathType }}
            pathType: {{ . }}
            {{- end }}
            backend:
              service:
                name: {{ include "graylog.service.name" $ }}
                port:
                  name: input-forwarder
          {{- end }}
    {{- end }}
{{- end }}
