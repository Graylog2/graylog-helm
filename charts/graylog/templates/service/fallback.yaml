{{- if and .Values.ingress.enabled .Values.ingress.config.defaultBackend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "graylog.fallback.name" . }}
  labels:
    app.kubernetes.io/component: default-backend
    {{- include "graylog.labels" . | nindent 4 }}
spec:
  selector:
    graylog-app: {{ include "graylog.fallback.name" . }}
  ports:
    - port: 80
      targetPort: 3000
{{- end }}