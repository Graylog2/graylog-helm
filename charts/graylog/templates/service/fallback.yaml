{{- if and .Values.ingress.enabled .Values.ingress.config.defaultBackend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "graylog.fallback.name" . }}
  {{- include "graylog.metadata.labels" (dict "context" $ "fixed" (dict "graylog-app" (include "graylog.fallback.name" .)) "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "indent" 2) }}
spec:
  selector:
    graylog-app: {{ include "graylog.fallback.name" . }}
  ports:
    - port: 80
      targetPort: 3000
{{- end }}