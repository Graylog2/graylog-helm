{{- $t := .Values.graylog.apiToken | default dict }}
{{- if and .Values.graylog.enabled $t.enabled }}
{{- /* helm upgrade --reuse-values skips the chart defaults for keys the stored
       release does not have. Without apiToken in the stored values, enabling it
       leaves everything but "enabled" unset, so fail with the fix. */ -}}
{{- if not (and (kindIs "map" $t.image) (kindIs "map" $t.bootstrap) (kindIs "map" $t.renew) (kindIs "map" $t.serviceAccount) (kindIs "map" $t.tls) (kindIs "map" $t.podSecurityContext) (kindIs "map" $t.containerSecurityContext)) }}
{{- fail "graylog.apiToken is missing its defaults. This happens with helm upgrade --reuse-values on a release installed before graylog.apiToken existed.\n  Use --reset-then-reuse-values instead of --reuse-values, or pass your values with -f." }}
{{- end }}
{{- if has "Admin" $t.roles }}
{{- fail "graylog.apiToken.roles cannot include Admin: Graylog refuses to assign the Admin role to a service account.\n  Set graylog.apiToken.roles to a non-Admin role that allows the endpoints your consumers call." }}
{{- end }}
{{- $name := include "graylog.apiToken.name" . }}
{{- $secretName := include "graylog.apiToken.secretName" . }}
{{- $bootstrap := include "graylog.apiToken.bootstrap" . | fromYaml }}
{{- $curlExtra := include "graylog.apiToken.curlExtra" . }}
{{- $beforeSeconds := include "graylog.duration.seconds" $t.renew.before }}
{{- if not $beforeSeconds }}
{{- fail (printf "graylog.apiToken.renew.before (%q) is not a usable ISO-8601 duration.\n  Use days, hours, minutes or seconds, the way Graylog shows token lifetimes: P14D, PT36H, P1DT12H." $t.renew.before) }}
{{- end }}
{{- $scheme := .Values.graylog.config.tls.enabled | ternary "https" "http" }}
{{- $url := printf "%s://%s.%s.svc.cluster.local:%s" $scheme (include "graylog.service.name" .) .Release.Namespace (include "graylog.service.port.app" .) }}
{{/* Everything here is a hook, so the Job's ServiceAccount, Role and bootstrap
     Secret are removed once the Job succeeds instead of standing as a permanent
     grant to write Secrets. Helm deletes succeeded hooks only after every hook
     of the phase has run, so they outlive the Job that needs them. After a
     failed Job they stay until the next successful run, see
     graylog.apiToken.hooks. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" $t.labels "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" $t.annotations "fixed" (include "graylog.apiToken.hooks" (dict "weight" "-5") | fromYaml) "indent" 2) }}
automountServiceAccountToken: {{ $t.serviceAccount.automount }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" $t.labels "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" $t.annotations "fixed" (include "graylog.apiToken.hooks" (dict "weight" "-5") | fromYaml) "indent" 2) }}
rules:
  # create cannot be limited by name; the rest is limited to the one Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" $t.labels "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" $t.annotations "fixed" (include "graylog.apiToken.hooks" (dict "weight" "-5") | fromYaml) "indent" 2) }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
{{- if $bootstrap.hookSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $bootstrap.name }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" $t.labels "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" $t.annotations "fixed" (include "graylog.apiToken.hooks" (dict "weight" "-5") | fromYaml) "indent" 2) }}
type: Opaque
data:
  GRAYLOG_ROOT_PASSWORD: {{ .Values.graylog.config.rootPassword | b64enc }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" $t.labels "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" $t.annotations "fixed" (include "graylog.apiToken.hooks" (dict "weight" "0" "failed" true) | fromYaml) "indent" 2) }}
spec:
  backoffLimit: {{ $t.backoffLimit }}
  activeDeadlineSeconds: {{ $t.activeDeadlineSeconds }}
  template:
    metadata:
      {{- include "graylog.metadata.labels" (dict "context" $ "labels" $t.labels "indent" 6) }}
      {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" $t.annotations "indent" 6) }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      {{- include "graylog.apiToken.pod" . | nindent 6 }}
      containers:
        - name: api-token
          {{- include "graylog.apiToken.container" . | nindent 10 }}
          {{- with $t.resources }}
          resources: {{ toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: MODE
              value: hook
            - name: RENEW_BEFORE_SECONDS
              value: {{ $beforeSeconds | quote }}
            - name: GRAYLOG_URL
              value: {{ $url | quote }}
            - name: ROOT_USER
              value: {{ .Values.graylog.config.rootUsername | default "admin" | quote }}
            - name: ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrap.name }}
                  key: {{ $bootstrap.key }}
            - name: SERVICE_USER
              value: {{ $t.username | quote }}
            - name: SERVICE_ROLES
              value: {{ $t.roles | toJson | quote }}
            - name: SERVICE_PERMISSIONS
              value: {{ include "graylog.apiToken.permissions" . | quote }}
            - name: TOKEN_NAME
              value: {{ $t.tokenName | quote }}
            - name: TOKEN_TTL
              value: {{ $t.ttl | quote }}
            - name: SECRET_NAME
              value: {{ $secretName | quote }}
            - name: SECRET_LABELS
              value: {{ (include "graylog.metadata.labels" (dict "context" $ "labels" $t.secretLabels "fixed" (dict "app" "graylog-app") "indent" 0) | fromYaml).labels | toJson | quote }}
            - name: SECRET_ANNOTATIONS
              value: {{ ((include "graylog.metadata.annotations" (dict "context" $ "annotations" $t.secretAnnotations "indent" 0) | fromYaml).annotations | default dict) | toJson | quote }}
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: WAIT_SECONDS
              value: {{ $t.waitSeconds | quote }}
            {{- if $curlExtra }}
            - name: CURL_EXTRA
              value: {{ $curlExtra | quote }}
            {{- end }}
            {{- with $t.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              {{- .Files.Get "files/scripts/api-token.sh" | nindent 14 }}
{{- end }}
