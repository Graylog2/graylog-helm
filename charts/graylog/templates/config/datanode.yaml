{{- if .Values.datanode.enabled }}
{{- $c := .Values.datanode.config }}
{{- $sk := $c.s3ClientDefaultSecretKey }}
{{- $ak := $c.s3ClientDefaultAccessKey }}
{{- $endpoint := $c.s3ClientDefaultEndpoint }}
{{- /*
All three or none. This mirrors the Data Node, which refuses to start on a
partial config with:

  S3 Client not configured properly, all s3_client_default_access_key,
  s3_client_default_secret_key and s3_client_default_endpoint have to be
  provided in the configuration!

The endpoint is required even for AWS S3, where the SDK could resolve it from
the region. Graylog's configuration reference lists it as optional; the running
code does not agree, and the code is what you get.
*/ -}}
{{- $anySet := or $ak $sk $endpoint }}
{{- $allSet := and $ak $sk $endpoint }}
{{- if and $anySet (not $allSet) }}
  {{ fail "datanode: s3ClientDefaultEndpoint, s3ClientDefaultAccessKey and s3ClientDefaultSecretKey must all be set together. The Data Node rejects a partial S3 client configuration at startup. For AWS S3 the endpoint is https://s3.<region>.amazonaws.com." }}
{{- end }}
{{- range include "graylog.datanode.groups" $ | fromYamlArray }}
{{- $fixed := dict "app.kubernetes.io/component" "datanode" "app" "graylog-datanode" }}
{{- with .groupLabel }}
{{- $_ := set $fixed "graylog-datanode-group" . }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .configmapName }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .labels "fixed" $fixed "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .annotations "indent" 2) }}
data:
  JAVA_OPTS: {{ .config.javaOpts | quote }}
  GRAYLOG_DATANODE_NODE_ID_FILE: {{ .config.nodeIdFile | default "/var/lib/graylog-datanode/node-id" | quote }}
  GRAYLOG_DATANODE_OPENSEARCH_HEAP: {{ .config.opensearchHeap | quote }}
  GRAYLOG_DATANODE_SKIP_PREFLIGHT_CHECKS: {{ .config.skipPreflightChecks | quote }}
  GRAYLOG_DATANODE_NODE_SEARCH_CACHE_SIZE: {{ .config.nodeSearchCacheSize | quote }}
  {{- with .roles }}
  GRAYLOG_DATANODE_NODE_ROLES: {{ join "," . | quote }}
  {{- end }}
  GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ENDPOINT: {{ .config.s3ClientDefaultEndpoint | quote }}
  GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_REGION: {{ .config.s3ClientDefaultRegion | quote }}
  GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_PROTOCOL: {{ .config.s3ClientDefaultProtocol | quote }}
  GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_PATH_STYLE_ACCESS: {{ .config.s3ClientDefaultPathStyleAccess | quote }}
{{- end }}
{{- end }}
