{{- if .Values.graylog.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "graylog.cm.init.name" . }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .Values.graylog.labels "fixed" (dict "app.kubernetes.io/component" "server" "app" "graylog-app") "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.graylog.annotations "indent" 2) }}
data:
  init-script.sh: |
    #!/bin/sh
    # Initialize the data dir.
    #
    # The sentinel is a dedicated marker, not the journal lock file. Volume
    # initialization and journal presence are independent concerns: the lock only
    # exists while a journal does, so disabling the journal - or anything else that
    # removes that lock - made every restart re-run the copy below and overwrite
    # volume contents with the image defaults.
    if [ -f /mnt/data/.initialized ]; then
      echo "Data volume already initialized, skipping copy."
    elif [ -f /mnt/data/journal/.lock ]; then
      # Migration path for volumes initialized by an earlier chart version: they
      # carry the journal lock but no marker. The lock is proof enough that the
      # copy already happened, so adopt the volume and stamp the marker. Running
      # the copy here would clobber a live volume - the exact failure this change
      # exists to prevent, triggered by the fix itself.
      echo "Data volume was initialized by an earlier chart version; adopting it."
      touch /mnt/data/.initialized
    else
      # A volume initialized by an earlier chart version with the journal disabled
      # has neither marker nor lock, so it lands here and is copied over once more.
      # That matches the old behaviour, which re-copied on every restart, and it
      # self-heals: the marker below stops it recurring.
      echo "Initializing data volume."
      # The marker is written only on success. Stamping it after a partial copy
      # would mark a broken volume as done and never retry.
      if cp -r /usr/share/graylog/data/* /mnt/data/; then
        touch /mnt/data/.initialized
      else
        echo "Error: failed to copy the default data directory to /mnt/data."
        exit 1
      fi
    fi
    {{ if and .Values.graylog.config.tls.enabled }}
    # check that the FDQN for all Graylog nodes is part of the certificate SANs
    {{- $fqdn := printf "%s.%s.svc.cluster.local" (include "graylog.service.name" .) .Release.Namespace }}
    if ! openssl x509 -in "/mnt/tls/tls.crt" -noout -checkhost {{ printf "test.%s" $fqdn | squote }}; then
      echo "The provided certificate does not match the Graylog pod FQDN."
      echo "Please, make sure to include {{ printf "DNS:*.%s" $fqdn | quote }} as another SAN in your certificate request."
      exit 1
    else
    {{- if .Values.graylog.config.tls.updateKeyStore }}
      # check if root CA is in cert file
      openssl crl2pkcs7 -nocrl -certfile "/mnt/tls/tls.crt" | openssl pkcs7 -print_certs -outform PEM | awk -v out="cert" '
      /-----BEGIN CERTIFICATE-----/ {n++; f=sprintf("%s-%03d.pem", out, n); writing=1}
      writing {print > f}
      /-----END CERTIFICATE-----/ {close(f); writing=0}
      '
      ROOT_CA=""
      for f in cert-*.pem; do
        subj="$(openssl x509 -in "$f" -noout -subject -nameopt RFC2253 | sed "s/^subject=//")"
        issu="$(openssl x509 -in "$f" -noout -issuer  -nameopt RFC2253 | sed "s/^issuer=//")"
        if [ "$subj" = "$issu" ]; then
          ROOT_CA="root-ca.pem"
          cp "$f" "${ROOT_CA}"
          break
        fi
      done
      if [ -z "${ROOT_CA}" ]; then
        echo "The certificate passed does not contain a root CA. Only this certificate will be added to the truststore."
        echo "Make sure to add a new certificate when performing certificate rotation."
      fi
      # Update Java keystore for BYO Graylog application certs
      CACERTS_SRC="/usr/share/graylog/data/cacerts"
      CACERTS_DST="/mnt/data/cacerts"
      mkdir -p "${CACERTS_SRC}" "${CACERTS_DST}"
      JAVA_HOME_LOCAL=$(java -XshowSettings:properties -version 2>&1 > /dev/null | grep 'java.home' | grep '/.*' -o)
      cp "${JAVA_HOME_LOCAL}/lib/security/cacerts" "${CACERTS_SRC}/graylog.jks"
      chown graylog:graylog "${CACERTS_SRC}/graylog.jks"
      keytool -importcert -noprompt -alias byoc -file "/mnt/tls/tls.crt" -keystore "${CACERTS_SRC}/graylog.jks" -storepass {{ .Values.graylog.config.tls.keyStorePass | default "changeit" }}
      [ -n "${ROOT_CA}" ] && echo "Adding root CA..." && keytool -importcert -noprompt -alias byoc-ca -file "${ROOT_CA}" -keystore "${CACERTS_SRC}/graylog.jks" -storepass {{ .Values.graylog.config.tls.keyStorePass | default "changeit" }}
      if [ ! -e "${CACERTS_DST}/graylog.jks" ] || ! cmp -s "${CACERTS_SRC}/graylog.jks" "${CACERTS_DST}/graylog.jks"; then
        cp "${CACERTS_SRC}/graylog.jks" "${CACERTS_DST}/graylog.jks"
        echo "Updated Java Key Store."
      else
        echo "Java Key Store has not been modified, nothing to do."
      fi
    {{- else }}
      echo "The Java Key Store remains unchanged. Ensure that the CA that signed your certificates is trusted by default."
    {{- end }}
    fi
    {{- end }}
    {{- if and .Values.opensearch.enabled .Values.opensearch.tls.enabled .Values.opensearch.tls.caSecret }}
    # Trust the BYO OpenSearch CA. The truststore must live on the data volume
    # (/mnt/data here, /usr/share/graylog/data in the main container) and is seeded
    # from the JDK CA bundle so public CAs (license checks, GeoIP, notifications)
    # stay trusted. Built in a temp file and mv'd so a failed init can't leave a
    # half-built store behind.
    CACERTS_DST="/mnt/data/cacerts"
    mkdir -p "${CACERTS_DST}"
    TRUSTSTORE_TMP="${CACERTS_DST}/graylog.jks.tmp"
    if [ -f "${CACERTS_DST}/graylog.jks" ]; then
      cp "${CACERTS_DST}/graylog.jks" "${TRUSTSTORE_TMP}"
    else
      cp "${JAVA_HOME}/lib/security/cacerts" "${TRUSTSTORE_TMP}"
    fi
    # delete-then-import so a rotated CA is picked up on pod restart
    keytool -delete -alias byo-opensearch-ca -keystore "${TRUSTSTORE_TMP}" -storepass {{ .Values.graylog.config.tls.keyStorePass | default "changeit" }} >/dev/null 2>&1 || true
    keytool -importcert -noprompt -alias byo-opensearch-ca -file "/mnt/os-tls/{{ .Values.opensearch.tls.caKey }}" -keystore "${TRUSTSTORE_TMP}" -storepass {{ .Values.graylog.config.tls.keyStorePass | default "changeit" }}
    mv "${TRUSTSTORE_TMP}" "${CACERTS_DST}/graylog.jks"
    echo "Imported OpenSearch CA into Graylog truststore."
    {{- end }}
    {{- if .Values.graylog.config.plugins.enabled }}
    # copy plugins
    [ -d /mnt/shared/plugins ] && find /mnt/shared/plugins/ -type f -name '*.jar' -exec cp {} /mnt/plugins/ \;

    {{- if and .Values.graylog.config.init.assetFetch.enabled .Values.graylog.config.init.assetFetch.plugins.enabled }}
    # retrieve plugins directly
    for urlchecksum in $(echo "${INIT_GRAYLOG_PLUGIN_URLS}" | tr "^" "\n"); do
      name=$(echo "$urlchecksum" | cut -d'|' -f1)
      url=$(echo "$urlchecksum" | cut -d'|' -f2)
      checksum=$(echo "$urlchecksum" | cut -d'|' -f3)
      wget -T 5 -t 3 "$url" -O "$name.jar" || { echo "Failed to fetch plugin $name.jar at $url"; continue; }
      if [ -n "$checksum" ]; then
        actual=$(sha256sum "$name.jar" | awk '{print $1}')
        if [ "$checksum" = "$actual" ]; then
          echo "Plugin checksum matches for $name.jar"
          cp "$name.jar" "/mnt/plugins/" && rm "$name.jar"
        else
          echo "Plugin checksum does NOT match for $name. Skipping plugin."
          rm "$name.jar"
        fi
      else
        echo "Warning: no checksum validation has been performed for plugin $name.jar"
        cp "$name.jar" "/mnt/plugins/" && rm "$name.jar"
      fi
    done
    {{- end }}
    {{- end }}
    {{- if and .Values.graylog.config.geolocation.enabled .Values.graylog.config.init.assetFetch.enabled .Values.graylog.config.init.assetFetch.geolocation.enabled }}
    mkdir -p /mnt/data/geolocation
    # retrieve geolocation mmdb files directly
    for urlchecksum in $(echo "${INIT_GRAYLOG_GEO_MMDB_URLS}" | tr "^" "\n"); do
      name=$(echo "$urlchecksum" | cut -d'|' -f1)
      url=$(echo "$urlchecksum" | cut -d'|' -f2)
      checksum=$(echo "$urlchecksum" | cut -d'|' -f3)
      wget -T 5 -t 3 "$url" -O "$name.mmdb" || { echo "Failed to fetch geolocation database $name.mmdb at $url"; continue; }
      if [ -n "$checksum" ]; then
        actual=$(sha256sum "$name.mmdb" | awk '{print $1}')
        if [ "$checksum" = "$actual" ]; then
          echo "Checksum matches for $name.mmdb"
          cp "$name.mmdb" "/mnt/data/geolocation/" && rm "$name.mmdb"
        else
          echo "Checksum does NOT match for $name.mmdb. Skipping database."
          rm "$name.mmdb"
        fi
      else
        echo "Warning: no checksum validation has been performed for database $name.mmdb"
        cp "$name.mmdb" "/mnt/data/geolocation/" && rm "$name.mmdb"
      fi
    done
    {{- end }}
    # check mongo credentials
    if env | grep GRAYLOG_MONGODB_URI | grep -q "@"; then
      echo "MongoDB credentials set. We're good to go!"
    else
      echo "Error: MongoDB credentials not set in MongoDB URI. Make sure secrets are up to date."
      exit 1
    fi
{{- end }}
