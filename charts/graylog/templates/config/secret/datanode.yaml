{{- if .Values.datanode.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graylog.datanode.secretsName" . }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .Values.datanode.labels "fixed" (dict "app" "graylog-datanode") "indent" 2) }}
  {{- $reloaderFixed := .Values.datanode.reloader.autoReload | ternary dict (dict "reloader.stakater.com/auto" "false") }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.datanode.annotations "fixed" $reloaderFixed "indent" 2) }}
{{- $creds := include "graylog.s3.credentials" (dict "context" $ "component" "datanode") | fromYaml }}
data:
  {{- /* Only inline credentials land here. An existing Secret is read directly. */}}
  {{- with $creds.secretKey }}
  GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_SECRET_KEY: {{ . | b64enc }}
  {{- end }}
  {{- with $creds.accessKey }}
  GRAYLOG_DATANODE_S3_CLIENT_DEFAULT_ACCESS_KEY: {{ . | b64enc }}
  {{- end }}
{{- end }}
