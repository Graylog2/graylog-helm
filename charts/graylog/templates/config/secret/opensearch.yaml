{{- if .Values.opensearch.enabled }}
{{/*
Dedicated secret carrying the external OpenSearch connection string.
Rendered whenever opensearch is enabled — independent of global.existingSecretName —
so GRAYLOG_ELASTICSEARCH_HOSTS is always injected into the Graylog pods.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "graylog.opensearch.secretName" . }}
  labels:
    {{- include "graylog.labels" . | nindent 4 }}
  annotations:
    {{- include "graylog.annotations" . | nindent 4 }}
data:
  GRAYLOG_ELASTICSEARCH_HOSTS: {{ include "graylog.opensearch.hosts" . | b64enc }}
{{- end }}
