{{- if .Values.mongodb.communityResource.enabled }}
{{/*
Fail early with an actionable message when the MongoDB operator CRD is missing.
The lookup guard skips the check for offline renders (helm template, unittest),
where .Capabilities only contains built-in API versions.
*/}}
{{- if and (not (.Capabilities.APIVersions.Has "mongodbcommunity.mongodb.com/v1/MongoDBCommunity")) (lookup "v1" "Namespace" "" .Release.Namespace) }}
{{- fail "The MongoDBCommunity CRD (mongodbcommunity.mongodb.com/v1) was not found in the cluster. Install the MongoDB Kubernetes Operator first (https://github.com/mongodb/mongodb-kubernetes), or set mongodb.communityResource.enabled=false and provide an external MongoDB via graylog.config.mongodb.customUri." }}
{{- end }}
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: {{ include "graylog.mongodb.crName" . }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .Values.mongodb.labels "fixed" (dict "app.kubernetes.io/component" "mongodb" "app" "graylog-mongodb") "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.mongodb.annotations "indent" 2) }}
spec:
  {{- $replicas := .Values.mongodb.replicas | default 2 | int }}
  {{- $arbiters := .Values.mongodb.arbiters | default 0 | int }}
  {{- if ge $arbiters $replicas }}
  {{- printf "Number of MongoDB arbiters must be less than the number of replicas (replicas=%d, arbiters=%d)." $replicas $arbiters | fail }}
  {{- end }}
  members: {{ $replicas }}
  {{- if gt $arbiters 0 }}
  arbiters: {{ $arbiters }}
  {{- end }}
  type: ReplicaSet
  version: {{ .Values.mongodb.version | default "7.0" | quote }}
  security:
    authentication:
      modes: ["SCRAM"]
      ignoreUnknownUsers: true
  users:
    - name: admin
      db: admin
      passwordSecretRef:
        name: {{ include "graylog.backupSecretName" . }}
        key: "mongodb-root-password"
      roles:
        - name: clusterAdmin
          db: admin
        - name: userAdminAnyDatabase
          db: admin
        - name: backup
          db: admin
        - name: restore
          db: admin
      scramCredentialsSecretName: {{ include "graylog.mongodb.crName" . | printf "%s-admin" }}
    - name: {{ include "graylog.mongodb.crUsername" . }}
      db: {{ include "graylog.mongodb.crDatabase" . }}
      passwordSecretRef:
        name: {{ include "graylog.backupSecretName" . }}
        key: "mongodb-db-password"
      roles:
        - name: readWrite
          db: {{ include "graylog.mongodb.crDatabase" . }}
      scramCredentialsSecretName: {{ printf "%s-%s" (include "graylog.mongodb.crName" .) (include "graylog.mongodb.crUsername" .) }}
  statefulSet:
    spec:
      template:
        {{/*
        No metadata block here on purpose.

        The MongoDB Community operator owns the pod template of the StatefulSet
        it manages: it sets `app: <crName>-svc` and nothing else, and that label
        is also its (immutable) selector. Labels set here are discarded - the
        chart used to render them and the resulting StatefulSet never carried
        them - so exposing mongodb.podLabels/podAnnotations would promise
        customization the operator cannot deliver. Worse, had the operator
        honoured an `app` override, the pods would no longer have matched the
        selector.

        Pod-level metadata for MongoDB has to come from the operator's own API,
        not from this chart. The MongoDBCommunity object itself still takes
        mongodb.labels / mongodb.annotations.
        */}}
        spec:
          serviceAccountName: {{ include "graylog.mongodb.serviceAccountName" . }}
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        # The MongoDB Community operator is the only thing that labels
                        # these pods, and it sets `app: <service name>` and nothing else.
                        # The chart's own labels are not present here.
                        app: {{ include "graylog.mongodb.crName" . | printf "%s-svc" }}
                    topologyKey: kubernetes.io/hostname
      volumeClaimTemplates:
        - metadata:
            name: data-volume
            {{- include "graylog.claim.metadata" (dict "labels" .Values.mongodb.persistence.labels "annotations" .Values.mongodb.persistence.annotations "indent" 12) }}
          spec:
            accessModes: ["ReadWriteOnce"]
            {{- with (include "graylog.mongodb.storageClassName" .) }}
            storageClassName: {{ . | quote }}
            {{- end }}
            resources:
              requests:
                storage: {{ .Values.mongodb.persistence.size.data | default "10G" | quote }}
        - metadata:
            name: logs-volume
            {{- include "graylog.claim.metadata" (dict "labels" .Values.mongodb.persistence.labels "annotations" .Values.mongodb.persistence.annotations "indent" 12) }}
          spec:
            accessModes: [ "ReadWriteOnce" ]
            {{- with (include "graylog.mongodb.storageClassName" .) }}
            storageClassName: {{ . | quote }}
            {{- end }}
            resources:
              requests:
                storage: {{ .Values.mongodb.persistence.size.logs | default "2G" | quote }}
{{- end }}
