{{- if and .Values.datanode.enabled .Values.datanode.podDisruptionBudget.enabled }}
{{- if .Values.datanode.podDisruptionBudget.consolidated }}
{{- if ge (include "graylog.datanode.replicas" . | int) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "graylog.fullname" . | printf "%s-pdb-datanode" }}
  namespace: {{ .Release.Namespace }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .Values.datanode.podDisruptionBudget.labels "fixed" (dict "app.kubernetes.io/component" "datanode" "app" "graylog-datanode") "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.datanode.podDisruptionBudget.annotations "indent" 2) }}
spec:
  {{- include "graylog.pdb.availability" (dict "pdb" .Values.datanode.podDisruptionBudget "default" 2) | nindent 2 }}
  selector:
    matchLabels:
      app: graylog-datanode
      {{- include "graylog.selectorLabels" . | nindent 6 }}
{{- end }}
{{- else }}
{{- range include "graylog.datanode.groups" $ | fromYamlArray }}
{{- if ge (.replicas | int) 1 }}
{{- $fixed := dict "app.kubernetes.io/component" "datanode" "app" "graylog-datanode" }}
{{- with .groupLabel }}
{{- $_ := set $fixed "graylog-datanode-group" . }}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .pdbName }}
  namespace: {{ $.Release.Namespace }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .podDisruptionBudget.labels "fixed" (merge (include "graylog.datanode.roleLabels" . | fromYaml) $fixed) "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .podDisruptionBudget.annotations "indent" 2) }}
spec:
  {{- include "graylog.pdb.availability" (dict "pdb" .podDisruptionBudget "default" 3) | nindent 2 }}
  selector:
    matchLabels:
      app: graylog-datanode
      {{- with .groupLabel }}
      graylog-datanode-group: {{ . }}
      {{- end }}
      {{- include "graylog.selectorLabels" $ | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
