{{- if and .Values.graylog.enabled .Values.graylog.podDisruptionBudget.enabled }}
{{- if ge (include "graylog.replicas" . | int) 2 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "graylog.fullname" . | printf "%s-pdb" }}
  namespace: {{ .Release.Namespace }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .Values.graylog.podDisruptionBudget.labels "fixed" (dict "app" "graylog-app") "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.graylog.podDisruptionBudget.annotations "indent" 2) }}
spec:
  minAvailable: {{ .Values.graylog.podDisruptionBudget.minAvailable | default 1 | int }}
  selector:
    matchLabels:
      app: graylog-app
      {{- include "graylog.selectorLabels" . | nindent 6 }}
{{- end }}
{{- end }}
