{{ if .Values.graylog.enabled  }}
## Graylog App StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "graylog.statefulset.name" . }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .Values.graylog.labels "fixed" (dict "app" "graylog-app" "app.kubernetes.io/component" "server") "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.graylog.annotations "indent" 2) }}
spec:
  replicas: {{ include "graylog.replicas" . | default 2 | int }}
  serviceName: {{ include "graylog.service.name" . }}
  selector:
    matchLabels:
      app: graylog-app
      {{- include "graylog.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.graylog.updateStrategy.type | default "RollingUpdate" | quote }}
    {{- if .Values.graylog.updateStrategy.type | default "RollingUpdate" | eq "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.graylog.updateStrategy.rollingUpdate.maxUnavailable | default 1 }}
      {{- with .Values.graylog.updateStrategy.rollingUpdate.partition }}
      partition: {{ int . }}
      {{- end }}
    {{- end }}
  {{- $ret := .Values.graylog.persistence.retentionPolicy }}
  {{- if eq ($ret.whenScaled | default "Retain") "Delete" }}
  {{- fail "graylog.persistence.retentionPolicy.whenScaled=Delete would destroy the journal of any scaled-in node.\n  Scaling in removes the highest ordinal; anything still unprocessed in its journal exists only on that claim, and nothing replays an orphaned journal.\n  Delete makes that loss silent and unrecoverable.\n  Either:\n    Leave whenScaled=Retain and delete claims by hand once verified empty (see docs/graylog-message-handling.md)\n    Or set graylog.persistence.enabled=false if this deployment does not need a durable journal." }}
  {{- end }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ $ret.whenDeleted | default "Retain" }}
    whenScaled: {{ $ret.whenScaled | default "Retain" }}
  template:
    metadata:
      {{- include "graylog.pod.labels" (dict "context" $ "labels" .Values.graylog.podLabels "fixed" (dict "app" "graylog-app" "app.kubernetes.io/component" "server") "indent" 6) }}
      {{- $podAnnotations := dict "checksum/config" (include "graylog.configChecksum" .) "checksum/secret" (include "graylog.secretsChecksum" .) }}
      {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.graylog.podAnnotations "fixed" $podAnnotations "indent" 6) }}
    spec:
      dnsPolicy: {{ .Values.graylog.dnsPolicy | default "ClusterFirst" }}
      {{- with .Values.graylog.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.graylog.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.graylog.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.graylog.schedulerName }}
      schedulerName: {{ . | quote }}
      {{- end }}
      {{- with .Values.graylog.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.graylog.terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ .Values.graylog.terminationGracePeriodSeconds | int }}
      {{- end }}
      {{- $pullSecrets := (.Values.graylog.image.imagePullSecrets | default .Values.global.imagePullSecrets) | default list }}
      {{- $geolocation := .Values.graylog.config.geolocation }}
      {{- if and $geolocation.enabled $geolocation.sidecar.enabled $geolocation.sidecar.image.imagePullSecrets }}
      {{- $pullSecrets = concat $pullSecrets $geolocation.sidecar.image.imagePullSecrets | uniq }}
      {{- end }}
      {{- with $pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.graylog.nodeSelector }}
      nodeSelector: {{ . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.graylog.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.nameOverride }}
      serviceAccountName: {{ include "graylog.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.graylog.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: copy-data
          image: {{ include "graylog.image" . }}
          imagePullPolicy: {{ .Values.graylog.image.imagePullPolicy }}
          {{- with .Values.graylog.initContainerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: [ "/bin/sh", "/scripts/init-script.sh" ]
          env:
            - name: INIT_GRAYLOG_PLUGIN_URLS
              value: {{ include "graylog.plugin.URLs" . | default "" }}
            - name: INIT_GRAYLOG_GEO_MMDB_URLS
              value: {{ include "graylog.mmdb.URLs" . | default "" }}
          envFrom:
            - configMapRef:
                name: {{ include "graylog.configmap.name" . }}
            - secretRef:
                name: {{ include "graylog.secretsName" . }}
            {{- if .Values.opensearch.enabled }}
            - secretRef:
                name: {{ include "graylog.opensearch.secretName" . }}
            {{- end }}
          volumeMounts:
            - name: {{ include "graylog.volume.name" . }}
              mountPath: /mnt/data
            - name: init-script
              mountPath: /scripts
            {{- if .Values.graylog.config.tls.enabled }}
            - name: tls-creds
              mountPath: /mnt/tls/tls.crt
              subPath: tls.crt
              readOnly: true
            {{- end }}
            {{- if and .Values.opensearch.enabled .Values.opensearch.tls.enabled .Values.opensearch.tls.caSecret }}
            - name: os-ca
              mountPath: /mnt/os-tls
              readOnly: true
            {{- end }}
            {{- with .Values.graylog.extraInitVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if .Values.graylog.config.plugins.enabled }}
            - name: init-plugins
              mountPath: /mnt/plugins
            {{- range .Values.graylog.plugins }}
            {{- if empty .image | and .existingClaim }}
            - name: {{ .name }}
              mountPath: {{ printf "/mnt/shared/plugins/%s" .name }}
            {{- end }}
            {{- end }}
        {{- range .Values.graylog.plugins }}
        {{- if empty .existingClaim | and .image }}
        - name: {{ printf "copy-plugin-%s" .name }}
          image: {{ .image }}
          {{- with $.Values.graylog.initContainerSecurityContext }}
          securityContext:
            {{- if not (hasKey . "readOnlyRootFilesystem") }}
            readOnlyRootFilesystem: true
            {{- end }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: [ "/bin/sh", "-c", "cp *.jar /mnt/plugins/" ]
          volumeMounts:
            - name: init-plugins
              mountPath: /mnt/plugins
        {{- end }}
        {{- end }}
        {{- end }}
        {{- with .Values.graylog.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: graylog-app
          image: {{ include "graylog.image" . }}
          imagePullPolicy: {{ .Values.graylog.image.imagePullPolicy }}
          {{- with .Values.graylog.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GRAYLOG_HTTP_PUBLISH_URI
              value: {{ include "graylog.publishUri" . | quote }}
          {{- if or .Values.graylog.env .Values.graylog.extraEnv }}
            {{- include "graylog.env" .Values.graylog | indent 12 }}
          {{- end }}
          {{/* Config for the preStop drain hook, which inherits this container's
               environment. Renders nothing when the drain is disabled. */}}
          {{- include "graylog.prestopDrain.env" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "graylog.configmap.name" . }}
            - secretRef:
                name: {{ include "graylog.secretsName" . }}
            {{- if .Values.opensearch.enabled }}
            - secretRef:
                name: {{ include "graylog.opensearch.secretName" . }}
            {{- end }}
          ports:
            - name: app
              containerPort: {{ .Values.graylog.service.ports.app | int }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.graylog.service.ports.metrics | int }}
              protocol: TCP
            {{- range .Values.graylog.inputs }}
            - name: {{ .name }}
              containerPort: {{ .targetPort | default .port | int }}
              protocol: {{ .protocol }}
            {{- end }}
            - name: {{ include "graylog.service.port.forwarder.config" . }}
              containerPort: 13302
              protocol: TCP
          {{- if .Values.graylog.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.graylog.service.ports.app | int }}
            initialDelaySeconds: {{ .Values.graylog.livenessProbe.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.graylog.livenessProbe.periodSeconds | int }}
            timeoutSeconds: {{ .Values.graylog.livenessProbe.timeoutSeconds | int }}
            failureThreshold: {{ .Values.graylog.livenessProbe.failureThreshold | int }}
            successThreshold: {{ .Values.graylog.livenessProbe.successThreshold |int }}
          {{- end }}
          {{- if .Values.graylog.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.graylog.service.ports.app | int }}
            initialDelaySeconds: {{ .Values.graylog.readinessProbe.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.graylog.readinessProbe.periodSeconds | int }}
            timeoutSeconds: {{ .Values.graylog.readinessProbe.timeoutSeconds | int }}
            failureThreshold: {{ .Values.graylog.readinessProbe.failureThreshold | int }}
            successThreshold: {{ .Values.graylog.readinessProbe.successThreshold | int }}
          {{- end }}
          {{- include "graylog.lifecycle" . | nindent 10 }}
          {{- with .Values.graylog.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ include "graylog.volume.name" . }}
              mountPath: /usr/share/graylog/data
            {{- if .Values.graylog.config.tls.enabled }}
            - name: tls-creds
              mountPath: /usr/share/graylog/tls
            {{- end }}
            {{- if .Values.graylog.config.plugins.enabled }}
            - name: init-plugins
              mountPath: /usr/share/graylog/plugin
            {{- end }}
            {{- with .Values.graylog.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- with (include "graylog.geolocation.sidecar" . | trim) }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- with .Values.graylog.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      tolerations:
      {{- with .Values.graylog.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
      {{- if .Values.graylog.affinity }}
        {{- toYaml .Values.graylog.affinity | nindent 8 }}
      {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - {{ .Release.Name }}
                    - key: app
                      operator: In
                      values:
                        - graylog-app
                topologyKey: kubernetes.io/hostname
      {{- end }}
      volumes:
      - name: init-script
        configMap:
          name: {{ include "graylog.cm.init.name" . }}
          defaultMode: 0755
      {{- with .Values.graylog.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- if and .Values.graylog.config.geolocation.enabled .Values.graylog.config.geolocation.sidecar.enabled }}
      - name: geoip-entrypoint
        configMap:
          name: {{ include "graylog.name.suffixed" (dict "base" (include "graylog.fullname" .) "suffix" "geoip-entrypoint") }}
          defaultMode: 0755
      - name: geoip-tmp
        emptyDir: {}
      {{- end }}
      {{- if .Values.graylog.config.tls.enabled }}
      - name: tls-creds
        secret:
          secretName: {{ .Values.graylog.config.tls.secretName | quote }}
      {{- end }}
      {{- if and .Values.opensearch.enabled .Values.opensearch.tls.enabled .Values.opensearch.tls.caSecret }}
      - name: os-ca
        secret:
          secretName: {{ .Values.opensearch.tls.caSecret }}
      {{- end }}
      {{- if .Values.graylog.config.plugins.enabled }}
      - name: init-plugins
        emptyDir: {}
      {{- range .Values.graylog.plugins }}
      {{- if empty .url | and .existingClaim }}
      - name: {{ .name }}
        persistentVolumeClaim:
          claimName: {{ .existingClaim }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if not .Values.graylog.persistence.enabled | or .Values.graylog.persistence.existingClaim }}
      - name: {{ include "graylog.volume.name" . }}
        {{- if .Values.graylog.persistence.existingClaim }}
        persistentVolumeClaim:
          claimName: {{ .Values.graylog.persistence.existingClaim }}
        {{- else }}
        emptyDir: {}
        {{- end }}
      {{- end }}
  {{- if not .Values.graylog.persistence.existingClaim | and .Values.graylog.persistence.enabled }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ include "graylog.volume.name" . }}
        {{- include "graylog.claim.metadata" (dict "labels" .Values.graylog.persistence.labels "annotations" .Values.graylog.persistence.annotations "indent" 8) }}
      spec:
        {{- with (include "graylog.storageClassName" .) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        accessModes:
        {{- if .Values.graylog.persistence.accessModes }}
        {{- range .Values.graylog.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        {{- else }}
          - "ReadWriteOnce"
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.graylog.persistence.size | default "8Gi" | quote }}
  {{- end }}
{{- end }}
