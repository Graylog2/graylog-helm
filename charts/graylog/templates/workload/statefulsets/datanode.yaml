{{- if .Values.datanode.enabled }}
{{- include "graylog.datanode.validate" . }}
{{- range include "graylog.datanode.groups" $ | fromYamlArray }}
{{- $fixed := dict "app" "graylog-datanode" "app.kubernetes.io/component" "datanode" }}
{{- with .groupLabel }}
{{- $_ := set $fixed "graylog-datanode-group" . }}
{{- end }}
{{/* The probe handler defaults read .Values.datanode.service.ports, so hand them
     this group's own values as if they were the datanode block. */}}
{{- $probeCtx := dict "Values" (dict "datanode" .) }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .fullname }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .labels "fixed" $fixed "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .annotations "indent" 2) }}
spec:
  replicas: {{ .replicas | int }}
  serviceName: {{ include "graylog.datanode.service.name" $ }}
  {{/* Immutable once the StatefulSet exists. See the values comment. Always
       rendered so the field is explicit in the manifest rather than inherited
       from an API-server default that could change. */}}
  podManagementPolicy: {{ .podManagementPolicy | default "OrderedReady" }}
  selector:
    matchLabels:
      app: graylog-datanode
      {{- with .groupLabel }}
      graylog-datanode-group: {{ . }}
      {{- end }}
      {{- include "graylog.selectorLabels" $ | nindent 6 }}
  updateStrategy:
    type: {{ .updateStrategy.type | default "RollingUpdate" | quote }}
    {{- if .updateStrategy.type | default "RollingUpdate" | eq "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .updateStrategy.rollingUpdate.maxUnavailable | default 1 }}
      {{- with .updateStrategy.rollingUpdate.partition }}
      partition: {{ int . }}
      {{- end }}
    {{- end }}
  {{/* Explicity add the Datanode retentionPolicy */}}
  {{- $dnRet := .persistence.retentionPolicy | default dict }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ $dnRet.whenDeleted | default "Retain" }}
    whenScaled: {{ $dnRet.whenScaled | default "Retain" }}
  template:
    metadata:
      {{- include "graylog.pod.labels" (dict "context" $ "labels" .podLabels "fixed" $fixed "indent" 6) }}
      {{- $podAnnotations := dict "checksum/config" (include "graylog.datanode.configChecksum" $) "checksum/secret" (include "graylog.secretsChecksum" $) }}
      {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .podAnnotations "fixed" $podAnnotations "indent" 6) }}
    spec:
      dnsPolicy: {{ .dnsPolicy | default "ClusterFirst" }}
      {{- with .dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .schedulerName }}
      schedulerName: {{ . | quote }}
      {{- end }}
      {{- with .runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- if not (kindIs "invalid" .terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ .terminationGracePeriodSeconds | int }}
      {{- end }}
      {{- with .image.imagePullSecrets | default $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .nodeSelector }}
      nodeSelector: {{ . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or $.Values.serviceAccount.create $.Values.serviceAccount.nameOverride }}
      serviceAccountName: {{ include "graylog.serviceAccountName" $ }}
      {{- end }}
      {{- with .podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .sysctlInit.enabled .extraInitContainers }}
      initContainers:
        {{- if .sysctlInit.enabled }}
        - name: sysctl-init
          image: "{{ .sysctlInit.image.repository }}:{{ .sysctlInit.image.tag }}"
          imagePullPolicy: {{ .sysctlInit.image.imagePullPolicy | default "IfNotPresent" }}
          {{- with .sysctlInit.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - sysctl -w vm.max_map_count={{ .sysctlInit.vmMaxMapCount }}
        {{- end }}
        {{- with .extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: graylog-datanode
          image: {{ include "graylog.datanode.image" $ }}
          imagePullPolicy: {{ .image.imagePullPolicy }}
          {{- with .containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ .configmapName }}
            - secretRef:
                name: {{ include "graylog.datanode.secretsName" $ }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GRAYLOG_DATANODE_NODE_NAME
              value: $(POD_NAME).{{ include "graylog.datanode.service.name" $ }}.{{ $.Release.Namespace }}.svc.cluster.local
            - name: GRAYLOG_DATANODE_OPENSEARCH_DISCOVERY_SEED_HOSTS
              value: {{ include "graylog.datanode.hosts" $ }}
            - name: GRAYLOG_DATANODE_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "graylog.secretsName" $ }}
                  key: GRAYLOG_PASSWORD_SECRET
            - name: GRAYLOG_DATANODE_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "graylog.secretsName" $ }}
                  key: GRAYLOG_MONGODB_URI
            {{- include "graylog.env" . | indent 12 }}
          ports:
            - name: api
              containerPort: {{ .service.ports.api | default 8999 | int }}
              protocol: TCP
            - name: data
              containerPort: {{ .service.ports.data | default 9200 | int }}
              protocol: TCP
            - name: config
              containerPort: {{ .service.ports.config | default 9300 | int }}
              protocol: TCP
          volumeMounts:
            - name: "data"
              mountPath: {{ .persistence.data.mountPath | default "/var/lib/graylog-datanode" | quote }}
            - name: native-libs
              mountPath: {{ .persistence.nativeLibs.mountPath | default "/native_libs" | quote }}
            {{- with .extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* Probe handlers and the reasoning behind them: _probes.tpl.
                 Readiness and startup watch the OpenSearch HTTP port, which the
                 Data Node binds well after its own REST API; liveness watches the
                 REST API, because that is the process being alive. */}}
          {{- include "graylog.probe" (dict
                "name" "startupProbe"
                "probe" .startupProbe
                "default" (include "graylog.probe.handler.datanodeDataTcp" $probeCtx)
                "indent" 10) -}}
          {{- include "graylog.probe" (dict
                "name" "livenessProbe"
                "probe" .livenessProbe
                "default" (include "graylog.probe.handler.datanodeApiTcp" $probeCtx)
                "indent" 10) -}}
          {{- include "graylog.probe" (dict
                "name" "readinessProbe"
                "probe" .readinessProbe
                "default" (include "graylog.probe.handler.datanodeDataTcp" $probeCtx)
                "indent" 10) -}}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      tolerations:
      {{- with .tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
      {{- if .affinity }}
        {{- toYaml .affinity | nindent 8 }}
      {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - {{ $.Release.Name }}
                    - key: app
                      operator: In
                      values:
                        - graylog-datanode
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if or (not (and .persistence.data.enabled .persistence.nativeLibs.enabled)) .extraVolumes }}
      volumes:
        {{- if not .persistence.nativeLibs.enabled }}
        - name: native-libs
          emptyDir: {}
        {{- end }}
        {{- if not .persistence.data.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if or .persistence.data.enabled .persistence.nativeLibs.enabled }}
  volumeClaimTemplates:
    {{- if .persistence.data.enabled }}
    - metadata:
        name: data
        {{- include "graylog.claim.metadata" (dict "labels" .persistence.data.labels "annotations" .persistence.data.annotations "indent" 8) }}
      spec:
        accessModes:
        {{- if .persistence.data.accessModes }}
        {{- range .persistence.data.accessModes }}
          - {{ . | quote }}
        {{- end }}
        {{- else }}
          - "ReadWriteOnce"
        {{- end }}
        {{- with .dataStorageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .persistence.data.size | default "8Gi" | quote }}
    {{- end }}
    {{- if .persistence.nativeLibs.enabled }}
    - metadata:
        name: native-libs
        {{- include "graylog.claim.metadata" (dict "labels" .persistence.nativeLibs.labels "annotations" .persistence.nativeLibs.annotations "indent" 8) }}
      spec:
        accessModes:
        {{- if .persistence.nativeLibs.accessModes }}
        {{- range .persistence.nativeLibs.accessModes }}
          - {{ . | quote }}
        {{- end }}
        {{- else }}
          - "ReadWriteOnce"
        {{- end }}
        {{- with .nativeLibsStorageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .persistence.nativeLibs.size | default "8Gi" | quote }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
