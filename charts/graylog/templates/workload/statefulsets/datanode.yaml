{{ if .Values.datanode.enabled  }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "graylog.datanode.name" . }}
  {{- include "graylog.metadata.labels" (dict "context" $ "labels" .Values.datanode.labels "fixed" (dict "app" "graylog-datanode" "app.kubernetes.io/component" "datanode") "indent" 2) }}
  {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.datanode.annotations "indent" 2) }}
spec:
  replicas: {{ include "graylog.datanode.replicas" . | int }}
  serviceName: {{ include "graylog.datanode.service.name" . }}
  selector:
    matchLabels:
      app: graylog-datanode
      {{- include "graylog.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: {{ .Values.datanode.updateStrategy.type | default "RollingUpdate" | quote }}
    {{- if .Values.datanode.updateStrategy.type | default "RollingUpdate" | eq "RollingUpdate" }}
    rollingUpdate:
      maxUnavailable: {{ .Values.datanode.updateStrategy.rollingUpdate.maxUnavailable | default 1 }}
      {{- with .Values.datanode.updateStrategy.rollingUpdate.partition }}
      partition: {{ int . }}
      {{- end }}
    {{- end }}
  {{/* Explicity add the Datanode retentionPolicy */}}
  {{- $dnRet := .Values.datanode.persistence.retentionPolicy | default dict }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ $dnRet.whenDeleted | default "Retain" }}
    whenScaled: {{ $dnRet.whenScaled | default "Retain" }}
  template:
    metadata:
      {{- include "graylog.pod.labels" (dict "context" $ "labels" .Values.datanode.podLabels "fixed" (dict "app" "graylog-datanode" "app.kubernetes.io/component" "datanode") "indent" 6) }}
      {{- $podAnnotations := dict "checksum/config" (include "graylog.datanode.configChecksum" .) "checksum/secret" (include "graylog.secretsChecksum" .) }}
      {{- include "graylog.metadata.annotations" (dict "context" $ "annotations" .Values.datanode.podAnnotations "fixed" $podAnnotations "indent" 6) }}
    spec:
      dnsPolicy: {{ .Values.datanode.dnsPolicy | default "ClusterFirst" }}
      {{- with .Values.datanode.dnsConfig }}
      dnsConfig:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.datanode.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.datanode.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.datanode.schedulerName }}
      schedulerName: {{ . | quote }}
      {{- end }}
      {{- with .Values.datanode.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- if not (kindIs "invalid" .Values.datanode.terminationGracePeriodSeconds) }}
      terminationGracePeriodSeconds: {{ .Values.datanode.terminationGracePeriodSeconds | int }}
      {{- end }}
      {{- with .Values.datanode.image.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.datanode.nodeSelector }}
      nodeSelector: {{ . | toYaml | nindent 8 }}
      {{- end }}
      {{- with .Values.datanode.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.nameOverride }}
      serviceAccountName: {{ include "graylog.serviceAccountName" . }}
      {{- end }}
      {{- with .Values.datanode.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.datanode.sysctlInit.enabled .Values.datanode.extraInitContainers }}
      initContainers:
        {{- if .Values.datanode.sysctlInit.enabled }}
        - name: sysctl-init
          image: "{{ .Values.datanode.sysctlInit.image.repository }}:{{ .Values.datanode.sysctlInit.image.tag }}"
          imagePullPolicy: {{ .Values.datanode.sysctlInit.image.imagePullPolicy | default "IfNotPresent" }}
          {{- with .Values.datanode.sysctlInit.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - sysctl -w vm.max_map_count={{ .Values.datanode.sysctlInit.vmMaxMapCount }}
        {{- end }}
        {{- with .Values.datanode.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: graylog-datanode
          image: {{ include "graylog.datanode.image" . }}
          imagePullPolicy: {{ .Values.datanode.image.imagePullPolicy }}
          {{- with .Values.datanode.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "graylog.datanode.configmap.name" . }}
            - secretRef:
                name: {{ include "graylog.datanode.secretsName" . }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GRAYLOG_DATANODE_NODE_NAME
              value: $(POD_NAME).{{ include "graylog.datanode.service.name" . }}.{{ .Release.Namespace }}.svc.cluster.local
            - name: GRAYLOG_DATANODE_OPENSEARCH_DISCOVERY_SEED_HOSTS
              value: {{ include "graylog.datanode.hosts" . }}
            - name: GRAYLOG_DATANODE_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "graylog.secretsName" . }}
                  key: GRAYLOG_PASSWORD_SECRET
            - name: GRAYLOG_DATANODE_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: {{ include "graylog.secretsName" . }}
                  key: GRAYLOG_MONGODB_URI
            {{- include "graylog.env" .Values.datanode | indent 12 }}
          ports:
            - name: api
              containerPort: {{ .Values.datanode.service.ports.api | default 8999 | int }}
              protocol: TCP
            - name: data
              containerPort: {{ .Values.datanode.service.ports.data | default 9200 | int }}
              protocol: TCP
            - name: config
              containerPort: {{ .Values.datanode.service.ports.config | default 9300 | int }}
              protocol: TCP
          volumeMounts:
            - name: "data"
              mountPath: {{ .Values.datanode.persistence.data.mountPath | default "/var/lib/graylog-datanode" | quote }}
            - name: native-libs
              mountPath: {{ .Values.datanode.persistence.nativeLibs.mountPath | default "/native_libs" | quote }}
            {{- with .Values.datanode.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.datanode.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.datanode.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.datanode.service.ports.api | default 8999 | int }}
            initialDelaySeconds: {{ .Values.datanode.livenessProbe.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.datanode.livenessProbe.periodSeconds | int }}
            timeoutSeconds: {{ .Values.datanode.livenessProbe.timeoutSeconds | int }}
            failureThreshold: {{ .Values.datanode.livenessProbe.failureThreshold | int }}
            successThreshold: {{ .Values.datanode.livenessProbe.successThreshold | int }}
          {{- end }}
          {{- if .Values.datanode.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.datanode.service.ports.api | default 8999 | int }}
            initialDelaySeconds: {{ .Values.datanode.readinessProbe.initialDelaySeconds | int }}
            periodSeconds: {{ .Values.datanode.readinessProbe.periodSeconds | int }}
            timeoutSeconds: {{ .Values.datanode.readinessProbe.timeoutSeconds | int }}
            failureThreshold: {{ .Values.datanode.readinessProbe.failureThreshold | int }}
            successThreshold: {{ .Values.datanode.readinessProbe.successThreshold | int }}
          {{- end }}
          {{- with .Values.datanode.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- with .Values.datanode.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      tolerations:
      {{- with .Values.datanode.tolerations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
      {{- if .Values.datanode.affinity }}
        {{- toYaml .Values.datanode.affinity | nindent 8 }}
      {{- else }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/instance
                      operator: In
                      values:
                        - {{ .Release.Name }}
                    - key: app
                      operator: In
                      values:
                        - graylog-datanode
                topologyKey: kubernetes.io/hostname
      {{- end }}
      {{- if or (not (and .Values.datanode.persistence.data.enabled .Values.datanode.persistence.nativeLibs.enabled)) .Values.datanode.extraVolumes }}
      volumes:
        {{- if not .Values.datanode.persistence.nativeLibs.enabled }}
        - name: native-libs
          emptyDir: {}
        {{- end }}
        {{- if not .Values.datanode.persistence.data.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
        {{- with .Values.datanode.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if or .Values.datanode.persistence.data.enabled .Values.datanode.persistence.nativeLibs.enabled }}
  volumeClaimTemplates:
    {{- if .Values.datanode.persistence.data.enabled }}
    - metadata:
        name: data
        {{- include "graylog.claim.metadata" (dict "labels" .Values.datanode.persistence.data.labels "annotations" .Values.datanode.persistence.data.annotations "indent" 8) }}
      spec:
        accessModes:
        {{- if .Values.datanode.persistence.data.accessModes }}
        {{- range .Values.datanode.persistence.data.accessModes }}
          - {{ . | quote }}
        {{- end }}
        {{- else }}
          - "ReadWriteOnce"
        {{- end }}
        {{- with (include "graylog.datanode.data.storageClassName" . ) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.datanode.persistence.data.size | default "8Gi" | quote }}
    {{- end }}
    {{- if .Values.datanode.persistence.nativeLibs.enabled }}
    - metadata:
        name: native-libs
        {{- include "graylog.claim.metadata" (dict "labels" .Values.datanode.persistence.nativeLibs.labels "annotations" .Values.datanode.persistence.nativeLibs.annotations "indent" 8) }}
      spec:
        accessModes:
        {{- if .Values.datanode.persistence.nativeLibs.accessModes }}
        {{- range .Values.datanode.persistence.nativeLibs.accessModes }}
          - {{ . | quote }}
        {{- end }}
        {{- else }}
          - "ReadWriteOnce"
        {{- end }}
        {{- with (include "graylog.datanode.nativeLibs.storageClassName" . ) }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.datanode.persistence.nativeLibs.size | default "8Gi" | quote }}
    {{- end }}
  {{- end }}
{{- end }}
