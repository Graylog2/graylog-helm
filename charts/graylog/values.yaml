# Default values for Graylog.

# provider enables provider-specific defaults (currently only "aws", which
# provisions a gp3 StorageClass). Leave empty for provider-agnostic behavior.
provider: ""

# version overrides the Graylog and Graylog Data Node image tag for both
# workloads at once. Defaults to the chart's appVersion when empty.
version: ""

# nameOverride replaces the chart name used in resource names and labels.
nameOverride: ""

# fullnameOverride replaces the fully qualified app name used as the prefix
# for all resource names.
fullnameOverride: ""

# global values are shared by the Graylog, Datanode, and MongoDB workloads.
global:
  # imagePullSecrets is applied to the Graylog and Datanode pods unless
  # overridden per image (MongoDB images are pulled by the operator).
  imagePullSecrets: []
  # existingSecretName points at an externally managed Secret holding all
  # Graylog credentials. When set, the chart does not create or manage secrets.
  existingSecretName: ""
  # storageClass is the default StorageClass for all persistent volumes.
  storageClass: ""
  # commonLabels/commonAnnotations are added to every object the chart renders.
  # Per-object labels/annotations and the chart's own identity labels take
  # precedence. commonLabels never reach a workload's selector, so they are
  # safe to add to an existing release.
  commonLabels: {}
  commonAnnotations: {}

# extraObjects renders arbitrary manifests as part of this release — a
# ServiceMonitor, ExternalSecret, NetworkPolicy, or anything else the chart does
# not model. Each entry is templated, so it can reference the release context.
# Entries may be mappings or strings; use a string when the manifest itself
# contains Helm syntax that must survive to render time.
#
# extraObjects:
#   - apiVersion: v1
#     kind: ConfigMap
#     metadata:
#       name: '{{ include "graylog.fullname" . }}-extra'
#     data:
#       release: "{{ .Release.Name }}"
extraObjects: []


# graylog configures the Graylog server application.
graylog:
  # enabled toggles the Graylog server StatefulSet, Service, PDB, and init
  # ConfigMap (the server ConfigMap and Secret are not gated by this flag).
  enabled: true
  # enterprise selects the graylog/graylog-enterprise image instead of the
  # open-source image.
  enterprise: true
  # replicas is the number of Graylog server pods.
  replicas: 2
  service:
    # nameOverride replaces the generated Service name.
    nameOverride: ""
    # type is the Kubernetes Service type (ClusterIP, NodePort, LoadBalancer).
    type: ClusterIP
    annotations: {}
    labels: {}
    ports:
      # app is the port serving the Graylog web interface and REST API.
      app: 9000
      # metrics is the port serving Prometheus metrics.
      metrics: 9833
    metrics:
      # enabled exposes the Prometheus metrics port on the Service.
      enabled: true
  # inputs declares Graylog inputs to expose as Service/container ports.
  # Each entry needs a name, port, and protocol; targetPort defaults to port.
  inputs:
    - name: input-gelf
      port: 12201
      targetPort: 12201
      protocol: TCP
    - name: input-forwarder
      port: 13301
      targetPort: 13301
      protocol: TCP
  # plugins lists Graylog plugins to install at startup. Entries reference a
  # download url (+ checksum), an OCI image, or an existingClaim with the jar.
  plugins: []
  # env sets additional environment variables on the Graylog container as a
  # simple key/value map.
  env: {}
  # config maps to Graylog server configuration (server.conf) settings.
  config:
    # rootUsername is the login of the Graylog root user.
    rootUsername: "admin"
    # rootPassword is the root user's password. Leave empty to have the chart
    # generate one on install (shown once in the install notes).
    rootPassword: ""
    # customSecretPepper is the secret used to pepper stored user data
    # (password_secret). Minimum 64 characters; generated when empty.
    customSecretPepper: ""
    # timezone is the root user's timezone.
    timezone: "UTC"
    # selfSignedStartup allows Graylog to boot with self-signed certificates.
    selfSignedStartup: "true"
    # serverJavaOpts sets the JVM options for the Graylog server process.
    serverJavaOpts: "-Xms1g -Xmx1g"
    # extraServerJavaOpts appends additional JVM options to serverJavaOpts.
    extraServerJavaOpts: []
    # leaderElectionMode controls how the leader node is chosen.
    leaderElectionMode: "automatic"
    # contentPacksAutoInstall installs bundled content packs on first boot.
    contentPacksAutoInstall: "true"
    # isCloud enables Graylog Cloud mode.
    isCloud: "false"
    tls:
      # enabled turns on TLS for the Graylog HTTP interface.
      enabled: false
      # secretName is a kubernetes.io/tls Secret with the certificate and key.
      secretName: ""
      # keyPassword is the password protecting the TLS private key, if any.
      keyPassword: ""
      # updateKeyStore imports the certificate into the JVM trust store.
      updateKeyStore: true
      # keyStorePass is the password of the JVM trust store.
      keyStorePass: "changeit"

    # Graylog Forwarder ingest (enterprise feature) has no server.conf settings.
    # The listener is configured as attributes on a Graylog input of type
    # "Forwarder" (org.graylog.plugins.forwarder.input.ForwarderServiceInput):
    # bind address, message port (13301), configuration port (13302), and gRPC
    # TLS all live there. Graylog binds 13301/13302 on every node once that input
    # exists. Self-managed deployments must create it under System > Inputs;
    # Graylog Cloud provisions it automatically. Behind a TLS-terminating load
    # balancer set forwarder_grpc_enable_tls false on the input -- it defaults to
    # true, and targets stay unhealthy otherwise.
    # Expose the ports with ingress.forwarder.*; there is nothing to set here.
    mongodb:
      # customUri is a full MongoDB connection string for an externally
      # managed MongoDB. Required when mongodb.communityResource.enabled=false.
      customUri: ""
      # maxConnections caps the MongoDB connection pool size.
      maxConnections: "1000"
      # versionProbeAttempts is the number of MongoDB version probe retries
      # at startup ("0" retries forever).
      versionProbeAttempts: "0"
    # messageJournal configures the on-disk message journal; fields map to
    # the message_journal_* settings in server.conf.
    #
    # An enabled journal requires durable storage: either
    # graylog.persistence.enabled=true or graylog.persistence.existingClaim. With
    # neither, the data dir is an emptyDir and unprocessed messages are lost on
    # every pod restart while Graylog still believes the journal is durable. The
    # chart refuses to render that combination.
    #
    # These are strings, not booleans - disabling the journal needs
    # `--set-string ...enabled=false`, as a bare `--set` is rejected by the schema.
    messageJournal:
      enabled: "true"
      # maxSize caps the on-disk journal (message_journal_max_size). Graylog's
      # own default is 5gb; it is set explicitly here because the cap and the
      # volume have to be sized together and the chart validates them together.
      #
      # This must leave room on graylog.persistence.size (default 8Gi) for the
      # node-id, truststore, content packs and GeoIP databases, which share the
      # volume. The chart refuses to render a cap above 90% of the volume.
      #
      # Raising this without raising persistence.size is the mistake it guards
      # against: a full journal throttles inputs by design, a full data volume
      # takes the node down. Suffixes are Graylog's own and binary - 5gb is
      # 5 x 1024^3 bytes, matching gl_journal_size_limit on the metrics endpoint.
      maxSize: "5gb"
      flushAge: "1m"
      flushInterval: "1000000"
      maxAge: "12h"
      segmentAge: "1h"
      segmentSize: "100mb"
    # network configures the HTTP interface of the Graylog server.
    network:
      connectTimeout: "5s"
      enableCors: "false"
      enableGzip: "true"
      maxHeaderSize: "8192"
      readTimeout: "10s"
      threadPoolSize: "64"
      # externalUri is the public URI of the Graylog web interface. It comes
      # before the Ingress hostnames and the LoadBalancer address. Give a full
      # URI: a bare hostname gets the chart scheme and app port.
      externalUri: ""
    # performance maps to the processing/buffer tuning knobs of server.conf.
    performance:
      asyncEventbusProcessors: "2"
      autoRestartInputs: "false"
      inputBufferProcessors: "2"
      inputBufferRingSize: "65536"
      inputBufferWaitStrategy: "blocking"
      jobSchedulerConcurrencyLimits: ""
      outputBatchSize: "500"
      outputFaultCountThreshold: "5"
      outputFaultPenaltySeconds: "30"
      outputFlushInterval: "1"
      outputBufferProcessorThreadsCorePoolSize: "3"
      outputBufferProcessors: ""
      processBufferProcessors: ""
    # email configures the SMTP transport for notifications.
    email:
      enabled: "false"
      senderAddress: "graylog@example.com"
      hostname: "mail.example.com"
      port: "587"
      socketConnectionTimeout: "10s"
      socketTimeout: "10s"
      useAuth: "true"
      useSsl: "false"
      useTls: "true"
      # webInterfaceUrl is the base URL used to build links in notification
      # emails.
      webInterfaceUrl: "https://graylog.example.com"
    plugins:
      # enabled turns on plugin installation via init containers.
      enabled: false
    # geolocation configures GeoIP databases for the Graylog geolocation
    # processor.
    geolocation:
      enabled: false
      maxmindGeoIp:
        # enabled wires the MaxMind credentials below into the chart-managed
        # Secret, where the GeoIP update sidecar reads them.
        enabled: true
        # MaxMind account credentials
        # When using global.existingSecretName, the external secret must contain:
        # - GEO_IP_MAXMIND_ACCOUNT_ID: base64-encoded MaxMind account ID
        # - GEO_IP_MAXMIND_LICENSE_KEY: base64-encoded MaxMind license key
        accountId:
        licenseKey:
        # Comma-separated list of MaxMind database editions to download
        # Examples: "GeoLite2-City GeoLite2-ASN", "GeoIP2-City GeoIP2-ISP"
        editionIds: "GeoLite2-City GeoLite2-ASN"
      # mmdbSources provides direct download URLs (and checksums) for the
      # city/asn mmdb files as an alternative to the MaxMind sidecar.
      mmdbSources:
        city:
          url:
          checksum:
        asn:
          url:
          checksum:
      # Sidecar container for GeoIP updates
      sidecar:
        enabled: true
        image:
          repository: maxmindinc
          name: geoipupdate
          tag: "7.1.1"
        # schedule is a cron expression controlling database update frequency.
        schedule: "0 0 * * *"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        # securityContext for the sidecar; the geoipupdate image requires root.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
          runAsNonRoot: false
          runAsUser: 0
          seccompProfile:
            type: RuntimeDefault
    init:
      # assetFetch controls download of plugins/geolocation assets by the
      # init container.
      assetFetch:
        enabled: false
        # skipChecksum disables checksum verification of downloaded assets.
        skipChecksum: false
        # allowHttp permits plain-HTTP download URLs (HTTPS-only by default).
        allowHttp: false
        plugins:
          enabled: false
          # baseUrl is prepended to relative plugin URLs.
          baseUrl:
        geolocation:
          enabled: false
          # baseUrl is prepended to relative mmdb URLs.
          baseUrl:
  image:
    # repository overrides the Graylog image; defaults to graylog/graylog or
    # graylog/graylog-enterprise depending on graylog.enterprise.
    repository: ""
    # tag overrides the image tag; defaults to `version` or the chart's
    # appVersion.
    tag: ""
    imagePullPolicy: IfNotPresent
    # imagePullSecrets overrides global.imagePullSecrets for this image.
    imagePullSecrets: []
  # updateStrategy is the StatefulSet update strategy. maxUnavailable needs the
  # MaxUnavailableStatefulSet feature gate. Without the gate, the API server
  # drops the field.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      partition:
  # resources are the compute requests/limits of the Graylog container.
  resources:
    limits:
      cpu: "2"
      memory: "2Gi"
    requests:
      cpu: "1"
      memory: "1Gi"
  # persistence configures the Graylog data volume (journal, node-id, ...).
  persistence:
    enabled: true
    # What happens to the journal PVCs when the StatefulSet is scaled in or
    # deleted. Both default to Retain, which is also the Kubernetes default -
    # set explicitly so it cannot drift, and so the schema can police it.
    #
    # whenScaled MUST stay Retain. Scaling in removes the highest ordinal, and
    # anything still unprocessed in its journal lives only on that claim; Delete
    # would destroy exactly the data the drain hook exists to protect, silently.
    # The chart refuses to render whenScaled: Delete for that reason.
    retentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    # storageClass overrides global.storageClass for this volume.
    storageClass:
    # volumeNameOverride replaces the generated PVC/volume name.
    volumeNameOverride:
    # existingClaim mounts a pre-provisioned PVC instead of using a
    # volumeClaimTemplate.
    existingClaim:
    # accessModes defaults to ["ReadWriteOnce"] when empty.
    accessModes: []
    # size is the requested volume size (default 8Gi).
    size:
    # annotations/labels for the volume claim template.
    #
    # Unlike everywhere else in this chart, global.commonLabels and
    # global.commonAnnotations deliberately do NOT flow here. A StatefulSet's
    # volumeClaimTemplates cannot be changed after creation, so injecting them
    # would rewrite an immutable field and make `helm upgrade` fail on every
    # existing release. Setting these yourself is safe on a fresh install; on a
    # live release it needs the StatefulSet recreated (--cascade=orphan).
    annotations: {}
    labels: {}
  # livenessProbe/readinessProbe expose the standard Kubernetes probe fields
  # for the Graylog container (TCP checks against the app port).
  livenessProbe:
    enabled: true
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  # Time Kubernetes allows for shutdown before SIGKILL. This budget covers the
  # preStop hook AND the SIGTERM that follows it — Graylog's graceful shutdown
  # (flip lb_status to DEAD, stop inputs, flush in-memory buffers into the
  # journal) has to finish inside whatever is left. The Kubernetes default of
  # 30s is not enough under load, which is why this is set explicitly.
  terminationGracePeriodSeconds: 300
  lifecycle:
    # postStart/preStop are your own hooks on the graylog-app container, in
    # standard Kubernetes syntax. preStop is mutually exclusive with
    # preStopDrain below — a container can only have one preStop hook, and the
    # chart fails the render rather than silently dropping either.
    postStart: {}
    preStop: {}
    # Hold pod termination while the on-disk journal is worked off.
    #
    # Scaling in is the case that matters: the ordinal stops existing, so its
    # journal is stranded in an orphaned PVC and nothing will ever replay it.
    # Graceful shutdown flushes buffers *into* the journal, never *out* of it.
    # This hook gives the doomed pod a chance to finish processing first.
    #
    # Off by default because it slows every rolling upgrade by the drain time.
    # It is best-effort, not a guarantee — see the Message Journal Lifecycle
    # scale-in runbook in docs/graylog-message-handling.md for the drain
    # procedure it does not replace.
    preStopDrain:
      enabled: false
      # Requires graylog.service.metrics.enabled: journal depth is read from the
      # unauthenticated Prometheus exporter, so no admin token is needed.
      #
      # Seconds to wait for EndpointSlice removal to reach kube-proxy before
      # sampling. Measuring earlier reads traffic that is already going away.
      endpointPropagationDelaySeconds: 15
      pollIntervalSeconds: 2
      # Reserved out of terminationGracePeriodSeconds for Graylog's own shutdown.
      # The drain never runs past
      #   terminationGracePeriodSeconds - endpointPropagationDelaySeconds - shutdownReserveSeconds
      # because a hook that eats the whole grace period gets the container
      # SIGKILLed with its in-memory buffers unflushed.
      shutdownReserveSeconds: 45
      # Give up once journal depth stops falling for this many polls. Endpoint
      # removal only sheds new connections; long-lived TCP and UDP senders keep
      # writing, and against those the journal never reaches zero.
      stallPolls: 10
      # How many times to retry the metrics probe before giving up. A single
      # failed scrape is usually a blip - the exporter briefly busy, a dropped
      # connection - and abandoning the drain on one miss defeats the hook.
      # Applies both to the preflight check and to failures mid-drain; retries
      # are spaced pollIntervalSeconds apart.
      metricsRetries: 5
      # A single reading of zero does not mean drained: under live ingest the
      # depth oscillates and can momentarily touch zero while messages are still
      # arriving. Require it to hold at zero across this many consecutive polls
      # before declaring success, so anything still writing resets the streak.
      # Costs confirmPolls x pollIntervalSeconds on an otherwise finished drain.
      confirmPolls: 3
      # How often to emit a progress line during the drain. Throttled separately
      # from pollIntervalSeconds so a long drain does not bury the container log;
      # the start, the verdict, and any warning are always logged regardless.
      statusIntervalSeconds: 10
      # Polls to observe before projecting whether the drain can finish at all.
      # stallPolls only notices a journal that has stopped falling; it cannot
      # notice one that is falling far too slowly to matter, because every new
      # low resets the counter. Against a deep backlog that means the hook holds
      # termination for the whole budget to clear a couple of percent, then
      # strands the rest anyway - and on a rolling upgrade it pays that per pod.
      # After this many polls the drain rate is measured and the finish time
      # projected; if it does not fit in the remaining budget the hook logs a
      # CRIT verdict (journal size on disk, measured rate, time to clear, how
      # much it is short by) and gives up at once, returning the grace period to
      # Graylog's own shutdown. Set to 0 to disable the projection and always
      # drain for the full budget.
      feasibilityWarmupPolls: 5
  # PodDisruptionBudgets are enabled by default for production deployments
  # They prevent cluster upgrades and maintenance from disrupting all instances
  # Set enabled: false only for non-production clusters or single-replica deployments
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    annotations: {}
    labels: {}
  # podSecurityContext / initContainerSecurityContext / containerSecurityContext
  # expose the standard Kubernetes securityContext fields; defaults follow a
  # non-root, no-privilege-escalation baseline.
  podSecurityContext:
    # fsGroup is required to make mounted volumes writable
    runAsUser: 1100
    runAsGroup: 1100
    runAsNonRoot: true
    fsGroup: 1100
    seccompProfile:
      type: RuntimeDefault
  initContainerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["NET_BIND_SERVICE"]
    seccompProfile:
      type: RuntimeDefault
  # annotations/labels are added to the Graylog StatefulSet object itself.
  # They merge over global.commonAnnotations/global.commonLabels.
  annotations: {}
  labels: {}
  # podAnnotations/podLabels are added to the Graylog pod template metadata.
  # podLabels never reach the StatefulSet's selector, so they are safe to
  # change on an existing release.
  podAnnotations: {}
  podLabels: {}
  # nodeSelector constrains Graylog pods to matching nodes.
  nodeSelector: {}
  # tolerations lets Graylog pods schedule onto tainted nodes.
  tolerations: []
  # affinity overrides the default anti-affinity that spreads Graylog pods
  # across nodes.
  affinity: {}
  # topologySpreadConstraints spreads Graylog pods across failure domains.
  # Unlike the default anti-affinity (which is a soft hostname preference),
  # these can enforce an even spread across zones. Standard Kubernetes syntax.
  topologySpreadConstraints: []
  # priorityClassName sets the scheduling priority of the Graylog pods.
  priorityClassName: ""
  # schedulerName selects an alternative scheduler.
  schedulerName: ""
  # runtimeClassName selects a container runtime class (e.g. gvisor).
  runtimeClassName: ""
  # terminationGracePeriodSeconds for the Graylog pods is set above, next to
  # the preStop drain whose budget depends on it.
  # dnsPolicy/dnsConfig control pod DNS resolution.
  dnsPolicy: ClusterFirst
  dnsConfig: {}
  # hostAliases adds entries to the pod's /etc/hosts.
  hostAliases: []
  # extraEnv sets additional environment variables using full EnvVar syntax
  # (supports valueFrom); entries here win over graylog.env keys.
  extraEnv: []
  # extraVolumes adds volumes to the Graylog pods, using standard Kubernetes
  # volume syntax.
  extraVolumes: []
  # extraVolumeMounts mounts those volumes into the graylog-app container.
  extraVolumeMounts: []
  # extraInitVolumeMounts mounts them into the chart's copy-data init
  # container instead, for assets that must be staged before startup.
  extraInitVolumeMounts: []
  # extraInitContainers are rendered after the chart's own init containers.
  extraInitContainers: []
  # extraContainers adds sidecar containers to the Graylog pods.
  extraContainers: []


# datanode configures the Graylog Data Node (managed OpenSearch).
datanode:
  # enabled toggles the Datanode StatefulSet, Service, and PDB (the Datanode
  # ConfigMap and Secret are not gated by this flag).
  enabled: true
  # replicas is the number of Datanode pods.
  replicas: 3
  service:
    annotations: {}
    labels: {}
    ports:
      # api is the Datanode REST API port.
      api: 8999
      # data is the OpenSearch HTTP port.
      data: 9200
      # config is the OpenSearch transport port.
      config: 9300
  # env sets additional environment variables on the Datanode container as a
  # simple key/value map.
  env: {}
  # config maps to Graylog Data Node configuration settings.
  config:
    # nodeIdFile is the path of the node-id file inside the container.
    nodeIdFile: ""
    # opensearchHeap is the heap size of the embedded OpenSearch process.
    opensearchHeap: "2g"
    # javaOpts sets JVM options for the Datanode process itself.
    javaOpts: "-Xms1g -Xmx1g"
    # skipPreflightChecks bypasses the Datanode preflight validation.
    skipPreflightChecks: "false"
    # nodeSearchCacheSize is the OpenSearch search cache size.
    nodeSearchCacheSize: "10gb"
    # s3ClientDefault* configure the S3 client used for searchable snapshots;
    # endpoint, accessKey, and secretKey must be set together.
    s3ClientDefaultSecretKey: ""
    s3ClientDefaultAccessKey: ""
    s3ClientDefaultEndpoint: ""
    s3ClientDefaultRegion: "us-east-2"
    s3ClientDefaultProtocol: "http"
    s3ClientDefaultPathStyleAccess: "true"
  image:
    # repository overrides the Datanode image (default graylog/graylog-datanode).
    repository: ""
    # tag overrides the image tag; defaults to `version` or the chart's
    # appVersion.
    tag: ""
    imagePullPolicy: IfNotPresent
    # imagePullSecrets overrides global.imagePullSecrets for this image.
    imagePullSecrets: []
  # sysctlInit runs a privileged init container that raises vm.max_map_count
  # for OpenSearch on nodes where the default is too low.
  sysctlInit:
    enabled: false
    image:
      repository: "busybox"
      tag: "1.35"
      imagePullPolicy: IfNotPresent
    securityContext:
      privileged: true
    vmMaxMapCount: 262144
  # updateStrategy is the StatefulSet update strategy. maxUnavailable needs the
  # MaxUnavailableStatefulSet feature gate. Without the gate, the API server
  # drops the field.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      partition:
  # resources are the compute requests/limits of the Datanode container.
  resources:
    limits:
      cpu: "1"
      memory: "5Gi"
    requests:
      cpu: "500m"
      memory: "3.5Gi"
  # persistence configures the Datanode volumes.
  persistence:
    # What happens to the Datanode PVCs when the StatefulSet is scaled in or
    # deleted. Both default to Retain, which is also the Kubernetes default -
    # set explicitly so it cannot drift, matching graylog.persistence.
    #
    # Delete is permitted here, unlike on the Graylog StatefulSet: shard data on
    # a scaled-in Data Node can be rebuilt from replicas, whereas an orphaned
    # Graylog journal cannot be replayed by anything. Only set whenScaled=Delete
    # if your indexes carry replicas and the cluster is green before you scale.
    retentionPolicy:
      whenDeleted: Retain
      whenScaled: Retain
    # data is the OpenSearch data volume.
    data:
      enabled: true
      storageClass: ""
      mountPath: ""
      accessModes: []
      size: "8Gi"
      # annotations/labels for the volume claim template. global.commonLabels
      # and global.commonAnnotations deliberately do not flow here — see the
      # note on graylog.persistence.annotations.
      annotations: {}
      labels: {}
    # nativeLibs is an optional volume for OpenSearch native libraries.
    nativeLibs:
      enabled: false
      storageClass: ""
      mountPath: ""
      accessModes: []
      size: "2Gi"
      # As above: the globals stop here because volumeClaimTemplates are
      # immutable once the StatefulSet exists.
      annotations: {}
      labels: {}
  # livenessProbe/readinessProbe expose the standard Kubernetes probe fields
  # for the Datanode container.
  livenessProbe:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  # PodDisruptionBudgets are enabled by default for production deployments
  # They prevent cluster upgrades and maintenance from disrupting all instances
  # Set enabled: false only for non-production clusters or single-replica deployments
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
    annotations: {}
    labels: {}
  podSecurityContext:
    fsGroup: 999
    fsGroupChangePolicy: "OnRootMismatch"
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
      add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETUID", "SETGID"]
    seccompProfile:
      type: RuntimeDefault
  # annotations/labels are added to the Datanode StatefulSet object itself.
  # They merge over global.commonAnnotations/global.commonLabels.
  annotations: {}
  labels: {}
  # podAnnotations/podLabels are added to the Datanode pod template metadata.
  # podLabels never reach the StatefulSet's selector, so they are safe to
  # change on an existing release.
  podAnnotations: {}
  podLabels: {}
  # nodeSelector constrains Datanode pods to matching nodes.
  nodeSelector: {}
  # tolerations lets Datanode pods schedule onto tainted nodes.
  tolerations: []
  # affinity overrides the default anti-affinity that spreads Datanode pods
  # across nodes.
  affinity: {}
  # topologySpreadConstraints spreads Datanode pods across failure domains.
  # The default anti-affinity is only a soft hostname preference and does not
  # guarantee zone spread; set this to enforce one. Standard Kubernetes syntax.
  topologySpreadConstraints: []
  # priorityClassName sets the scheduling priority of the Datanode pods.
  priorityClassName: ""
  # schedulerName selects an alternative scheduler.
  schedulerName: ""
  # runtimeClassName selects a container runtime class (e.g. gvisor).
  runtimeClassName: ""
  # terminationGracePeriodSeconds is the shutdown grace period. Leave empty
  # for the Kubernetes default.
  terminationGracePeriodSeconds:
  # dnsPolicy/dnsConfig control pod DNS resolution.
  dnsPolicy: ClusterFirst
  dnsConfig: {}
  # hostAliases adds entries to the pod's /etc/hosts.
  hostAliases: []
  # lifecycle sets postStart/preStop hooks on the graylog-datanode container.
  lifecycle: {}
  # extraEnv sets additional environment variables using full EnvVar syntax
  # (supports valueFrom); entries here win over datanode.env keys.
  extraEnv: []
  # extraVolumes adds volumes to the Datanode pods, using standard Kubernetes
  # volume syntax.
  extraVolumes: []
  # extraVolumeMounts mounts those volumes into the graylog-datanode container.
  extraVolumeMounts: []
  # extraInitContainers are rendered after the chart's own init containers.
  extraInitContainers: []
  # extraContainers adds sidecar containers to the Datanode pods.
  extraContainers: []


# External OpenSearch
# Point Graylog at an existing, self-managed OpenSearch cluster instead of the bundled
# Graylog Data Node. Enable this AND set `datanode.enabled: false` (the two are mutually
# exclusive). See docs/bring-your-own-opensearch.md.
#
# Requirements: OpenSearch must be a Graylog-supported version (2.x, <= 2.19.x; NOT 3.0+),
# with `action.auto_create_index: false` on the backend.
opensearch:
  enabled: false
  # One or more OpenSearch node REST URIs (scheme + host + port)
  hosts: []
    # - https://my-opensearch.my-namespace.svc.cluster.local:9200
  auth:
    # Reference an existing secret holding the username/password (e.g. the opensearch operator's
    # "<cluster>-admin-password" / custom admin credentials secret). Read at template time.
    existingSecret: ""
    usernameKey: "username"
    passwordKey: "password"
    # OR provide credentials inline (takes precedence over existingSecret; dev/test only).
    username: ""
    password: ""
  tls:
    # Set false only if the OpenSearch HTTP layer is plaintext (hosts use http://).
    enabled: true
    # Secret containing the CA cert that signed the OpenSearch HTTP layer, imported into
    # Graylog's Java truststore so it trusts the HTTPS endpoint. The operator stores it in
    # "<cluster>-ca". Leave empty only if the CA is already trusted by the JVM by default.
    caSecret: ""
    caKey: "ca.crt"


# Graylog service account
serviceAccount:
  # create makes the chart manage the ServiceAccount. Set create=false and
  # nameOverride to use an existing, externally managed ServiceAccount.
  create: true
  # automount controls automountServiceAccountToken on the ServiceAccount.
  automount: true
  # annotations is added to the ServiceAccount (e.g. IRSA role ARNs).
  annotations: {}
  # labels is added to the ServiceAccount.
  labels: {}
  # nameOverride replaces the generated ServiceAccount name, or names the
  # existing ServiceAccount to use when create=false.
  nameOverride: ""
  # role optionally creates a namespaced Role/RoleBinding with these rules.
  role:
    create: false
    annotations: {}
    labels: {}
    rules: []
#      - apiGroups: [ "" ]
#        resources: [ "pods" ]
#        resourceNames: []
#        verbs: [ "get" ]


# Ingress configuration
# more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  # enabled is the master switch for all Ingress resources.
  enabled: false
  config:
    # defaultBackend deploys a small "waiting room" fallback service that
    # answers while Graylog is starting up.
    defaultBackend:
      enabled: true
    # tls selects how Ingress certificates are issued via cert-manager.
    tls:
      clusterIssuer:
        # existingName references a pre-existing ClusterIssuer.
        existingName:
      issuer:
        # existingName references a pre-existing namespaced Issuer.
        existingName:
        # annotations/labels are added to the chart-managed cert-manager Issuer.
        annotations: {}
        labels: {}
        # managed creates a Let's Encrypt ACME Issuer owned by this chart.
        managed:
          enabled: false
          # staging uses the Let's Encrypt staging endpoint (untrusted certs,
          # generous rate limits).
          staging: true
  # web exposes the Graylog web interface/API.
  web:
    enabled: false
    # className is the IngressClass to use.
    className: ""
    annotations: {}
    labels: {}
    hosts:
      - host: ""
        paths:
          - path: /
            pathType: ImplementationSpecific
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - chart-example.local
  # Graylog Forwarder ingest. A forwarder requires BOTH gRPC channels to be
  # reachable: the message channel (13301) it ships log data on, and the
  # configuration channel (13302) it polls for configuration updates.
  # Each channel is a separate Ingress resource because they listen on
  # different ports and an Ingress routes on host/path, not listener port.
  forwarder:
    enabled: false
    messageChannel:
      enabled: true
      className: ""
      # annotations/labels are added to this channel's Ingress object.
      annotations: {}
      labels: {}
      hosts:
        - host: ""
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls: []
    configChannel:
      enabled: true
      className: ""
      # annotations/labels are added to this channel's Ingress object.
      annotations: {}
      labels: {}
      hosts:
        - host: ""
          paths:
            - path: /
              pathType: ImplementationSpecific
      tls: []


# MongoDB Community Resource configuration
# Requires MongoDB Kubernetes Operator: https://github.com/mongodb/mongodb-kubernetes/tree/master/docs/mongodbcommunity
mongodb:
  communityResource:
    # enabled renders a MongoDBCommunity resource for the operator to manage.
    # Set to false to bring your own MongoDB via graylog.config.mongodb.customUri.
    enabled: true
  # version is the MongoDB server version deployed by the operator.
  version: "7.0.25"
  # For production deployments, use 3 data-bearing replicas with no arbiters.
  # This configuration supports w:majority writes even with one replica down.
  # For cost-optimized test/staging environments, use the PSA topology instead:
  # replicas: 2, arbiters: 1
  replicas: 3
  arbiters: 0
  # annotations/labels are added to the MongoDBCommunity object itself.
  annotations: {}
  labels: {}
  # No podAnnotations/podLabels here: the MongoDB Community operator owns the
  # pod template of the StatefulSet it manages and discards anything the chart
  # puts there, so the keys would silently do nothing. annotations/labels above
  # apply to the MongoDBCommunity object itself and do work.
  persistence:
    # storageClass overrides global.storageClass for the MongoDB volumes.
    storageClass: ""
    size:
      data: "10G"
      logs: "2G"
    # annotations/labels are added to the MongoDB volume claim templates. The
    # operator copies them onto the StatefulSet it manages, where they become
    # immutable, so global.commonLabels/commonAnnotations do not flow here —
    # see the note on graylog.persistence.annotations.
    annotations: {}
    labels: {}
  # serviceAccount configures the ServiceAccount used by the MongoDB pods;
  # fields mirror the top-level serviceAccount block.
  serviceAccount:
    create: true
    automount: true
    annotations: {}
    labels: {}
    nameOverride: ""
    # role creates the Role/RoleBinding required by the MongoDB operator's
    # readiness/version-upgrade hooks.
    role:
      create: true
      annotations: {}
      labels: {}
      rules:
        - apiGroups: [""]
          resources: ["secrets"]
          resourceNames: []
          verbs: ["get"]
        - apiGroups: [""]
          resources: ["pods"]
          resourceNames: []
          verbs: ["get", "patch", "delete"]
