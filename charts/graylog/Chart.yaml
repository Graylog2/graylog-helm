apiVersion: v2
name: graylog
description: Official Graylog Helm chart for Kubernetes
icon: "https://raw.githubusercontent.com/Graylog2/graylog2-server/refs/tags/7.1\
  .8/graylog2-web-interface/public/images/favicon.png"
type: application
home: https://graylog.org
sources:
  - https://github.com/graylog2
keywords:
  - SIEM
  - API
  - Triage
  - Security
  - Observability
  - Search
  - Logs
  - Monitoring
  - Troubleshooting
  - Events
  - Alerts
annotations:
  artifacthub.io/category: security
  artifacthub.io/operator: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: "graylog"
      image: "graylog/graylog:7.1.8"
      whitelisted: true
      platforms:
        - linux/amd64
        - linux/arm64
    - name: "graylog-datanode"
      image: "graylog/graylog-datanode:7.1.8"
      whitelisted: true
      platforms:
        - linux/amd64
        - linux/arm64
  # Changelog. Left empty on purpose: it is generated from CHANGELOG.md when the
  # chart is packaged for a release, so the published chart always matches the
  # release notes. Edit CHANGELOG.md on the release PR to change what ArtifactHub
  # shows; entries written here are replaced at packaging and never published.
  # The key itself must stay - packaging fails without it.
  artifacthub.io/changes: ""
  artifacthub.io/containsSecurityUpdates: "true"
# This is the chart version.
version: 2.0.0
# This is the version number of the Graylog application bundled with this chart.
appVersion: "7.1.8"

# End of file. Thanks for scrolling.
