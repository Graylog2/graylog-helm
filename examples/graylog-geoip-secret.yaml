# Example MaxMind GeoIP Secret
# The GeoIP update sidecar reads the MaxMind credentials from this Secret directly, so
# they never pass through the chart-managed Graylog Secret. It is independent of
# global.existingSecretName -- the primary Graylog Secret is not expected to carry
# MaxMind credentials.
#
# Create the Secret in the release namespace, then point the chart at it:
#
#   graylog:
#     config:
#       geolocation:
#         enabled: true
#         maxmindGeoIp:
#           enabled: true
#           existingSecret: graylog-geoip-secret-example
#           # Override these when your Secret uses different key names, e.g. the
#           # accountId/licenseKey keys an ExternalSecret or SealedSecret produces.
#           accountIdKey: GEO_IP_MAXMIND_ACCOUNT_ID
#           licenseKeyKey: GEO_IP_MAXMIND_LICENSE_KEY
#
# WARNING: the values below are placeholders. Replace both <...> values before you
# apply this file, and never commit real credentials.
#
# This Secret uses stringData, so both values are PLAIN TEXT and Kubernetes encodes
# them for you. Do not base64 encode them yourself, and take care not to leave a
# trailing newline (use `printf %s`, not `echo`) -- the sidecar sends these straight
# to MaxMind, which rejects a key with stray whitespace.
#
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: graylog-geoip-secret-example
stringData:
  # MaxMind account ID, as shown on your MaxMind account page.
  GEO_IP_MAXMIND_ACCOUNT_ID: "<maxmind-account-id>"
  # MaxMind license key.
  GEO_IP_MAXMIND_LICENSE_KEY: "<maxmind-license-key>"
