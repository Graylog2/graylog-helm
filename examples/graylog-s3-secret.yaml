# S3 credentials for the Data Node snapshot repository and Graylog's archive backend.
# Reference via global.s3.existingSecret, or datanode.config.s3ClientDefaultExistingSecret
# for the Data Node only (overrides global.s3 rather than merging with it).
#
# Data Node also needs datanode.config.s3ClientDefaultEndpoint set, or it ignores global.s3.
#
# Archiving ignores this by default; prefer IRSA. No IRSA? Set
# graylog.config.archive.useGlobalS3Credentials: true. Never both: the AWS SDK reads env
# vars before the web identity token, so env silently wins.
#
# Rotating this Secret restarts nothing. Roll manually:
#   kubectl rollout restart statefulset -l app=graylog-datanode
#   kubectl rollout restart statefulset -l app=graylog-app
#
# Don't commit real credentials. stringData is plain text, don't base64 it. Avoid a
# trailing newline (printf %s, not echo) or S3 will reject the signature.
#
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: graylog-s3-secret-example
stringData:
  AWS_ACCESS_KEY_ID: "<s3-access-key-id>"
  AWS_SECRET_ACCESS_KEY: "<s3-secret-access-key>"
