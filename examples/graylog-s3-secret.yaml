# S3 credentials for the Data Node's snapshot repository and Graylog's archive backend.
# The pods read this Secret directly, so nothing passes through a chart-managed Secret.
#
# Share it through global.s3. Endpoints and regions are not sensitive and stay with the
# component:
#
#   global:
#     s3:
#       existingSecret: graylog-s3-secret-example
#       # Override when your Secret has key names of its own.
#       accessKeyKey: AWS_ACCESS_KEY_ID
#       secretKeyKey: AWS_SECRET_ACCESS_KEY
#
#   datanode:
#     config:
#       # The endpoint opts the Data Node in. Without one it ignores global.s3.
#       # Required on AWS too.
#       s3ClientDefaultEndpoint: "https://s3.us-east-1.amazonaws.com"
#
# For one component only, set datanode.config.s3ClientDefaultExistingSecret instead. A
# component that names its own credential ignores global.s3 rather than merging.
#
# Graylog archiving does not read this by default. Use IRSA: annotate the service account
# and leave the key fields out of the archive backend. Where that is not available, set
# graylog.config.archive.useGlobalS3Credentials: true to export these as AWS_ACCESS_KEY_ID
# and AWS_SECRET_ACCESS_KEY. Never both. The AWS SDK reads the environment before the web
# identity token, so it overrides the IRSA role and logs nothing about it.
#
# Rotating this Secret restarts nothing. Roll the pods yourself:
#
#   kubectl rollout restart statefulset -l app=graylog-datanode
#   kubectl rollout restart statefulset -l app=graylog-app
#
# Replace both placeholders below, and never commit real credentials. stringData is plain
# text, so do not base64 encode it. Avoid a trailing newline (printf %s, not echo): S3
# rejects a signature built from a key with stray whitespace.
#
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: graylog-s3-secret-example
stringData:
  AWS_ACCESS_KEY_ID: "<s3-access-key-id>"
  AWS_SECRET_ACCESS_KEY: "<s3-secret-access-key>"
