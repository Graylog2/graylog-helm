# Example: Graylog on AWS (EKS) using an ACM certificate with the AWS Load
# Balancer Controller (ALB Ingress) + external-dns, backed by gp3 storage.
#
# AWS Load Balancer Controller: https://kubernetes-sigs.github.io/aws-load-balancer-controller/latest/
# External DNS:                 https://kubernetes-sigs.github.io/external-dns/latest/docs/tutorials/aws/
#
# Notes:
#   - Image tags are intentionally not pinned here; they default to the chart's
#     appVersion so the example stays compatible with the chart it ships with.
#   - "gp3" refers to a StorageClass you must have provisioned via the EBS CSI
#     driver. Create one (e.g. with `type: gp3`) or change these to your own.

graylog:
  persistence:
    enabled: true
    storageClass: "gp3"
    size: 5Gi
  inputs:
    - name: gelf-tcp
      port: 12201
      targetPort: 12201
      protocol: TCP

datanode:
  replicas: 3
  persistence:
    data:
      enabled: true
      storageClass: "gp3"
      size: 5Gi
  # Prevent Karpenter from disrupting DataNodes (stateful search data).
  podAnnotations:
    karpenter.sh/do-not-disrupt: "true"

ingress:
  # Top-level switch must be on in addition to the per-ingress `web.enabled`.
  enabled: true
  web:
    enabled: true
    className: "alb"
    annotations:
      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:000000000000:certificate/00000000-0000-0000-0000-000000000000
      alb.ingress.kubernetes.io/group.name: some-graylog
      alb.ingress.kubernetes.io/healthcheck-interval-seconds: "5"
      alb.ingress.kubernetes.io/healthcheck-path: /
      alb.ingress.kubernetes.io/healthcheck-port: "9000"
      alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
      alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "2"
      alb.ingress.kubernetes.io/healthy-threshold-count: "2"
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
      alb.ingress.kubernetes.io/load-balancer-attributes: "deletion_protection.enabled=false"
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/security-groups: sg-00000000000000000,sg-00000000000000001,sg-00000000000000002,sg-000000000000000003
      alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
      alb.ingress.kubernetes.io/ssl-redirect: "443"
      alb.ingress.kubernetes.io/success-codes: "200"
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
      external-dns.alpha.kubernetes.io/hostname: some-graylog.example.com
    hosts:
      - host: some-graylog.example.com
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: graylog-app
                port:
                  name: app
