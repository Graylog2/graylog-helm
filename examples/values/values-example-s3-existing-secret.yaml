# Example: S3 credentials from a Secret you manage.
#
# Used by Graylog archiving and by the Data Node snapshot repository (the
# `search` role needs one). The pods read the Secret directly, so the keys never
# pass through a chart-managed Secret and never appear in your values.
#
# Create the Secret first. examples/graylog-s3-secret.yaml shows its shape.
# Use printf and not echo to avoid a trailing newline, which makes S3 reject the
# signature.
#
#   kubectl -n <namespace> create secret generic graylog-s3-secret \
#     --from-literal=AWS_ACCESS_KEY_ID="$(printf %s '<access key id>')" \
#     --from-literal=AWS_SECRET_ACCESS_KEY="$(printf %s '<secret access key>')"
#
# Without static keys, use IRSA instead. See values-example-irsa.yaml.
#
# Rotating the Secret restarts nothing. Roll the pods yourself:
#   kubectl rollout restart statefulset -l app=graylog-datanode
#   kubectl rollout restart statefulset -l app=graylog-app

global:
  s3:
    existingSecret: graylog-s3-secret

graylog:
  config:
    archive:
      # Archiving ignores global.s3 by default, so it can use IRSA. Turn this on
      # to give it the keys above. Never combine it with IRSA: the AWS SDK reads
      # environment variables before the web identity token, so the keys win and
      # archiving authenticates as the wrong principal without logging it.
      useGlobalS3Credentials: true

datanode:
  config:
    # The Data Node needs the endpoint, even on AWS, or it ignores global.s3.
    s3ClientDefaultEndpoint: "https://s3.us-east-1.amazonaws.com"
    s3ClientDefaultRegion: "us-east-1"
    s3ClientDefaultProtocol: "https"
    s3ClientDefaultPathStyleAccess: "false"

    # Optional: give the Data Node its own Secret. It replaces global.s3 for the
    # Data Node as a whole and is not merged with it. Set the key names if your
    # Secret already uses its own, as an ExternalSecret usually does.
    # s3ClientDefaultExistingSecret: graylog-datanode-s3-secret
    # s3ClientDefaultAccessKeyKey: AWS_ACCESS_KEY_ID
    # s3ClientDefaultSecretKeyKey: AWS_SECRET_ACCESS_KEY
