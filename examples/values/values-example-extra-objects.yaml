# Example: OpenSearch cluster health as Prometheus metrics, using extraObjects.
#
# extraObjects adds your own Kubernetes manifests to the release, for objects
# the chart doesn't model. They install and uninstall with the release, and
# entries can use templates such as {{ .Release.Name }}.
#
# Graylog's Prometheus exporter has no OpenSearch health metric. This deploys
# json_exporter to read it from the Graylog API, and a ServiceMonitor to scrape
# it. You get graylog_indexer_cluster_health_status (labeled green, yellow or
# red) and the active, initializing, relocating and unassigned shard counts.
# Alert on red, or on unassigned shards above 0. During a Data Node rollout,
# wait for relocating and unassigned shards to reach 0.
#
# Needs a Graylog access token. The health API requires login, so create a token
# for a dedicated admin user in the web UI and store it in a Secret before you
# install, or the exporter pod won't start. Use `create`, not `apply`, so the
# token isn't copied into an annotation:
#
#   kubectl -n <namespace> create secret generic graylog-api-token \
#     --from-literal=username='<graylog access token>' \
#     --from-literal=password='token'
#
# Also needs the Prometheus Operator CRDs. The ServiceMonitor `release` label
# must match your Prometheus's serviceMonitorSelector.

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: '{{ include "graylog.fullname" . }}-json-exporter'
    data:
      config.yml: |
        modules:
          graylog_indexer_health:
            headers:
              Accept: application/json
            http_client_config:
              basic_auth:
                username_file: /etc/graylog-api/username
                password_file: /etc/graylog-api/password
            metrics:
              - name: graylog_indexer_cluster_health
                type: object
                help: "Graylog indexer (OpenSearch) cluster health via /api/system/indexer/cluster/health"
                path: '{ $ }'
                labels:
                  status: '{ .status }'
                values:
                  status: 1
                  active_shards: '{ .shards.active }'
                  initializing_shards: '{ .shards.initializing }'
                  relocating_shards: '{ .shards.relocating }'
                  unassigned_shards: '{ .shards.unassigned }'

  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: '{{ include "graylog.fullname" . }}-json-exporter'
      labels:
        app.kubernetes.io/component: json-exporter
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/component: json-exporter
          app.kubernetes.io/instance: '{{ .Release.Name }}'
      template:
        metadata:
          labels:
            app.kubernetes.io/component: json-exporter
            app.kubernetes.io/instance: '{{ .Release.Name }}'
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: json-exporter
              image: quay.io/prometheuscommunity/json-exporter:v0.8.0
              args:
                - --config.file=/config/config.yml
              ports:
                - name: http
                  containerPort: 7979
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: graylog-api
                  mountPath: /etc/graylog-api
                  readOnly: true
              resources:
                requests:
                  cpu: "10m"
                  memory: "32Mi"
                limits:
                  cpu: "100m"
                  memory: "96Mi"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              livenessProbe:
                httpGet:
                  # json_exporter has no /health route. /metrics is cheap.
                  path: /metrics
                  port: http
                periodSeconds: 30
          volumes:
            - name: config
              configMap:
                name: '{{ include "graylog.fullname" . }}-json-exporter'
            - name: graylog-api
              secret:
                secretName: graylog-api-token

  - apiVersion: v1
    kind: Service
    metadata:
      name: '{{ include "graylog.fullname" . }}-json-exporter'
      labels:
        app.kubernetes.io/component: json-exporter
    spec:
      type: ClusterIP
      selector:
        app.kubernetes.io/component: json-exporter
        app.kubernetes.io/instance: '{{ .Release.Name }}'
      ports:
        - name: http
          port: 7979
          targetPort: http
          protocol: TCP

  - apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: '{{ include "graylog.fullname" . }}-json-exporter'
      labels:
        # Match your Prometheus's serviceMonitorSelector.
        release: kube-prometheus-stack
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/component: json-exporter
      namespaceSelector:
        matchNames:
          - '{{ .Release.Namespace }}'
      endpoints:
        - port: http
          # json_exporter proxies: it fetches ?target= and converts the JSON.
          path: /probe
          params:
            module:
              - graylog_indexer_health
            target:
              - 'http://{{ include "graylog.service.name" . }}:{{ include "graylog.service.port.app" . }}/api/system/indexer/cluster/health'
          interval: 30s
          scrapeTimeout: 10s
          relabelings:
            # Without this every series is labelled with the exporter pod, but
            # the data describes the Graylog cluster.
            - targetLabel: instance
              replacement: '{{ include "graylog.fullname" . }}'
