# Example SMTP credentials Secret
# The Graylog container reads the SMTP username and password from this Secret
# directly, so they never pass through the chart-managed Secret. It is independent of
# global.existingSecretName -- the primary Graylog Secret is not expected to carry them.
#
# Create the Secret in the release namespace, then point the chart at it:
#
#   graylog:
#     config:
#       email:
#         enabled: "true"
#         hostname: smtp.example.com
#         senderAddress: graylog@example.com
#         useAuth: "true"
#         subjectPrefix: "[Graylog]"
#         existingSecret: graylog-email-secret-example
#         # Override these when your Secret uses different key names.
#         authUsernameKey: GRAYLOG_TRANSPORT_EMAIL_AUTH_USERNAME
#         authPasswordKey: GRAYLOG_TRANSPORT_EMAIL_AUTH_PASSWORD
#
# WARNING: the values below are placeholders. Replace both <...> values before you
# apply this file, and never commit real credentials.
#
# This Secret uses stringData, so both values are PLAIN TEXT and Kubernetes encodes
# them for you. Do not base64 encode them yourself.
#
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: graylog-email-secret-example
stringData:
  GRAYLOG_TRANSPORT_EMAIL_AUTH_USERNAME: "<smtp-username>"
  GRAYLOG_TRANSPORT_EMAIL_AUTH_PASSWORD: "<smtp-password>"
